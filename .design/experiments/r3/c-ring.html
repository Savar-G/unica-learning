<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>C - Ring</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.how{display:grid;grid-template-columns:250px 440px 1fr;gap:28px;align-items:center}
.start{position:relative}.start .k{font:400 12.5px "Geist Mono",monospace;color:var(--accent);margin-bottom:10px}
.ring{position:relative;width:100%;aspect-ratio:1}
.ring svg{width:100%;height:100%;overflow:visible}
.ring circle.trk{fill:none;stroke:var(--line);stroke-width:2}
.ring circle.arc{fill:none;stroke:var(--accent);stroke-width:2;stroke-dasharray:6 8}
.node{position:absolute;transform:translate(-50%,-50%);border:0;background:#fff;border-radius:999px;padding:8px 14px 8px 8px;display:flex;gap:8px;align-items:center;box-shadow:0 0 0 1px var(--line);font:500 15px "Geist",sans-serif;cursor:pointer;color:var(--ink);transition:box-shadow .3s,background .3s}
.node b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--card);font:400 12px "Geist Mono",monospace}
.node.act{box-shadow:0 0 0 2px var(--accent)}.node.act b{background:var(--accent);color:#fff}
.orbit{transform-origin:220px 220px;transition:transform 1.1s cubic-bezier(.5,0,.3,1)}
.mid{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.mid div{font:500 26px "Caveat",cursive;color:var(--accent);line-height:1.1}
.detail .card{background:var(--card)}
.entry{position:absolute;right:-30px;top:50%;width:30px;height:2px;background:var(--accent)}
.entry:after{content:"";position:absolute;right:-2px;top:-5px;border:6px solid transparent;border-left:9px solid var(--accent);border-right:0}
@media (max-width:1100px){.how{grid-template-columns:1fr;max-width:460px;margin:0 auto}.entry{right:50%;top:auto;bottom:-30px;width:2px;height:30px}.entry:after{right:-5px;bottom:-4px;top:auto;border:6px solid transparent;border-top:9px solid var(--accent);border-bottom:0}}
</style></head><body>
<div class="tag">C · Ring</div>
<div class="eyebrow">How it works</div><h2>One assessment. Then a loop.</h2>
<p class="lead">Every book is built from the last one, so the work always matches what your child needs next.</p>
<div class="how" id="how">
  <div class="start"><div class="k">Start here</div><div id="first"></div><span class="entry"></span></div>
  <div class="ring" id="ring">
    <svg viewBox="0 0 440 440"><circle class="trk" cx="220" cy="220" r="170"/>
      <path id="ret" d="" fill="none" stroke="#ff6a3d" stroke-width="2" stroke-dasharray="6 8"/>
      <g class="orbit" id="orbit"><circle cx="390" cy="220" r="7" fill="#ff6a3d"/></g></svg>
    <div class="mid"><div>repeats<br>with every book</div></div>
  </div>
  <div class="detail" id="detail" aria-live="polite"></div>
</div>
<script src="steps.js"></script>
<script>
document.getElementById("first").innerHTML=card(STEPS[0]);
const loop=STEPS.slice(1), ring=document.getElementById("ring"), orbit=document.getElementById("orbit"), detail=document.getElementById("detail");
const A=[180,252,324,36,108], R=170, C=220;
loop.forEach((s,k)=>{const a=A[k]*Math.PI/180, b=document.createElement("button"); b.className="node"; b.innerHTML=`<b>${s.n}</b>${s.t}`;
  b.style.left=(C+R*Math.cos(a))/440*100+"%"; b.style.top=(C+R*Math.sin(a))/440*100+"%"; b.onclick=()=>{auto=false; go(k)}; ring.appendChild(b)});
// highlight the arc from 6 back to 2
const p=(deg)=>{const a=deg*Math.PI/180;return[C+R*Math.cos(a),C+R*Math.sin(a)]}; const [x1,y1]=p(108),[x2,y2]=p(180);
document.getElementById("ret").setAttribute("d",`M${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2}`);
const nodes=[...ring.querySelectorAll(".node")]; let cur=0, turns=0, auto=true;
function go(k){ if(k<cur) turns++; cur=k; nodes.forEach((n,j)=>n.classList.toggle("act",j===k)); orbit.style.transform=`rotate(${A[k]+turns*360}deg)`; detail.innerHTML=card(loop[k]); }
go(0);
if(!reduced) setInterval(()=>{ if(auto) go((cur+1)%5) },2200);
</script></body></html>
