<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>J. Prediction</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
.pr { display: grid; grid-template-columns: minmax(0, 6fr) minmax(0, 5fr); gap: clamp(20px, 4vw, 56px); margin-top: 8px; padding: clamp(28px, 5vw, 64px); align-items: center; }
@media (max-width: 820px) { .pr { grid-template-columns: 1fr; } }
.pr .k { color: var(--ink); }
.say { margin-top: 14px; font-size: clamp(26px, 3.2vw, 40px); font-weight: 300; line-height: 1.15; letter-spacing: -.03em; }
.say .date { display: inline-block; padding: 0 .18em; background: #fff; border-radius: 6px; font-weight: 500; transition: transform .25s cubic-bezier(.34,1.56,.64,1); }
.say .date.bump { transform: translateY(-4px) scale(1.04); }
.q { margin-top: 26px; font-weight: 500; }
.choices { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.choices button { display: grid; gap: 2px; padding: 14px 12px; border: 0; border-radius: 12px; background: rgba(255,255,255,.7); text-align: left; cursor: pointer; transition: background .2s, transform .2s; }
.choices button:hover { background: #fff; }
.choices button b { font-size: 20px; font-weight: 500; letter-spacing: -.02em; }
.choices button span { font: 400 12px/1.3 var(--mono); color: var(--ink-2); }
.choices button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.choices button[aria-pressed="true"] span { color: #d6d6dc; }
.curve { padding: 18px 16px 10px; border-radius: 16px; background: #fff; box-shadow: 0 30px 50px -34px rgba(0,0,0,.5); }
.curve svg { display: block; width: 100%; height: auto; overflow: visible; }
.curve text { font-family: "Geist Mono", monospace; }
.grow { stroke-dasharray: 900; stroke-dashoffset: 900; animation: draw 1.3s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fine { margin-top: 12px; font-size: 13px; line-height: 1.5; color: var(--ink-2); }
</style>
</head>
<body>
<div class="chrome"><span class="v">J. Prediction</span><div class="cases" data-cases></div><a href="board.html">All options</a></div>
<main class="page">
  <div class="stub">Report: "Where Leah is", "What's in workbook 1" (unchanged)</div>
  <section class="section" id="out"></section>
  <div class="stub">Next step: card and plan button (unchanged)</div>
</main>
<script src="levels.js"></script><script src="pace.js"></script>
<script>
const MIN = { 3: "15 to 30 min", 4: "15 to 30 min", 5: "15 to 30 min" };
let last = null;
mount((p, setPace) => {
  const W = 420, H = 260, L = 14, R = 14, T = 40, B = 40;
  // A soft curve from today to the goal, through each grade's start (real dates).
  const t0 = REPORT_DATE.getTime(), t1 = p.goalDate.getTime();
  const x = (d) => L + (d.getTime() - t0) / (t1 - t0) * (W - L - R);
  const y = (g) => T + (p.goal - g) / (p.goal - p.c.working) * (H - T - B);
  const pts = [[x(REPORT_DATE), y(p.c.working)], ...p.grades.map((s) => [x(s.date), y(s.grade)])];
  let d = `M${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i]; const cx = (x0 + x1) / 2; d += ` C${cx} ${y0}, ${cx} ${y1}, ${x1} ${y1}`; }
  const area = d + ` L${pts.at(-1)[0]} ${H - B} L${pts[0][0]} ${H - B} Z`;
  const [gx, gy] = pts.at(-1);
  const mids = p.grades.slice(1, -1).map((s) => `<circle cx="${x(s.date)}" cy="${y(s.grade)}" r="5" fill="#fff" stroke="#0c0c0e" stroke-width="2"/><text x="${x(s.date) - 8}" y="${y(s.grade) - 12}" text-anchor="end" font-size="11" fill="#44444c">${gradeName(s.grade)} · ${monthShort(s.date)}</text>`).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${headline(p)}">
    <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a3d" stop-opacity=".22"/><stop offset="1" stop-color="#ff6a3d" stop-opacity="0"/></linearGradient></defs>
    <line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#e4e4e7"/>
    <path d="${area}" fill="url(#g)"/><path class="grow" d="${d}" fill="none" stroke="#0c0c0e" stroke-width="3" stroke-linecap="round"/>
    ${mids}
    <circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="7" fill="#2fb37a"/><text x="${pts[0][0]}" y="${H - B + 20}" font-size="11" fill="#0c0c0e">Today</text>
    <text x="${pts[0][0]}" y="${pts[0][1] - 14}" font-size="11" fill="#44444c">${gradeName(p.c.working)}</text>
    <g transform="translate(${gx - 3} ${gy - 46})"><path d="M3 46V2" stroke="#0c0c0e" stroke-width="2.5" stroke-linecap="round"/><path d="M4 3h26l-7 8 7 8H4z" fill="#ff6a3d"/></g>
    <text x="${gx - 8}" y="${gy - 54}" text-anchor="end" font-size="12" font-weight="600" fill="#0c0c0e">${gradeName(p.goal)}</text>
    <text x="${gx}" y="${H - B + 20}" text-anchor="end" font-size="11" fill="#0c0c0e">${monthShort(p.goalDate)} ${p.goalDate.getFullYear()}</text></svg>`;
  const out = document.getElementById("out");
  out.innerHTML = `
    <div class="pr field">
      <div>
        <p class="k">Our prediction for ${p.c.name}</p>
        <p class="say">From ${p.c.name}'s test and the BC curriculum, we predict ${p.c.name} can reach a <b>${gradeName(p.goal)}</b> level by <span class="date">${monthYear(p.goalDate)}</span>.</p>
        <p class="q">How many days a week can ${p.c.name} practise?</p>
        <div class="choices" role="group" aria-label="Days a week">${[3, 4, 5].map((dd) => `<button type="button" data-pace="${dd}" aria-pressed="${dd === p.daysPerWeek}"><b>${dd} days</b><span>${MIN[dd]} a day</span></button>`).join("")}</div>
        <p class="fine">${basis(p)}</p>
      </div>
      <div class="curve">${svg}</div>
    </div>`;
  wirePace(out, setPace);
  if (last !== null && last !== p.daysPerWeek) { const el = out.querySelector(".date"); el.classList.add("bump"); setTimeout(() => el.classList.remove("bump"), 260); }
  last = p.daysPerWeek;
});
</script>
</body>
</html>
