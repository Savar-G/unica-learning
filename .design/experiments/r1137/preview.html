<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maya lesson layout comparison</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 Geist, system-ui, sans-serif; }
  main { display: grid; gap: 14px; }
  h1, h2, h3, p { margin: 0; }
  h2 { font-size: 17px; }
  button, select, input { font: inherit; }
  button, select, summary { cursor: pointer; }
  :is(button, summary, input, select):focus-visible { outline: 3px solid #2457d6; outline-offset: 3px; }
  .options { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .options > label { display: grid; gap: 2px; }
  .options button, .options select {
    min-height: 44px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--border, #d4d4d8); background: var(--card, white); color: inherit;
  }
  .options button[aria-pressed="true"] { background: var(--primary, #151515); color: var(--primary-foreground, white); }
  .choice-copy { font-size: 14px; }
  .screen {
    --ink: #0c0c0e; --subtle: #44444c; --line: #e4e4e7; --canvas: #f5f5f6;
    --peach: #fff1ea; --red: #b43d12; --blue: #244c9d;
    margin: auto; width: 100%; container-type: inline-size; color: var(--ink); background: var(--canvas);
    border: 1px solid #d3d3d8; border-radius: 14px; overflow: clip;
  }
  .screen[data-size="phone"] { max-width: 390px; }
  .desk-top, .desk-footer {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: white;
  }
  .desk-top { border-bottom: 1px solid var(--line); }
  .desk-top .leave { margin-left: auto; }
  .desk-footer { grid-area: controls; border: 1px solid var(--line); border-radius: 11px; }
  .person { display: flex; align-items: center; gap: 8px; font-weight: 650; }
  .person img { width: 32px; height: 32px; border-radius: 50%; }
  .desk-status { font-size: 13px; color: var(--subtle); }
  .screen button, .screen summary, .screen input {
    min-height: 44px; border: 1px solid var(--line); border-radius: 9px;
    padding: 8px 12px; background: white; color: var(--ink);
  }
  .screen summary { display: flex; align-items: center; gap: 8px; }
  .screen summary::after { content: "▾"; margin-left: auto; }
  .screen details[open] summary::after { content: "▴"; }
  .screen .primary { background: var(--ink); border-color: var(--ink); color: white; font-weight: 600; }
  .screen button[aria-pressed="true"] { background: var(--peach); border-color: var(--red); color: var(--red); }
  .desk-workspace {
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 0.52fr);
    grid-template-areas: "question question" "board help" "controls controls" "nav nav"; gap: 12px; padding: 12px;
  }
  .question, .teaching, .prompt, .desk-nav {
    min-width: 0; background: white; border: 1px solid var(--line); border-radius: 11px; padding: 12px;
  }
  .question { grid-area: question; display: flex; align-items: center; gap: 12px; justify-content: space-between; }
  .question small { color: var(--subtle); display: block; }
  .equation { font-variant-numeric: tabular-nums; font-size: 24px; letter-spacing: .04em; }
  .teaching { grid-area: board; display: grid; gap: 10px; align-content: start; }
  .prompt { grid-area: help; display: grid; gap: 8px; align-content: start; }
  .prompt h3, .teaching h3 { font-size: 15px; }
  .prompt details p { padding: 8px 2px 0; }
  .desk-nav { grid-area: nav; padding: 0; }
  .desk-nav summary { border: 0; }
  .nav-items { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 10px 10px; }
  .canvas {
    display: grid; gap: 4px; min-width: 0; padding: 10px; border: 1px solid var(--line); border-radius: 10px;
    background: radial-gradient(#d6d8de 1px, transparent 1.2px) 6px 6px / 18px 18px #fff;
  }
  .block-zones { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .zone, .groups {
    min-width: 0; padding: 6px; border-radius: 8px; background: #f6f8ff;
    border: 1px solid #c6d2f2; color: #18377d; font-size: 13px;
  }
  .zone strong { display: block; padding-bottom: 4px; }
  .rods, .ones { display: flex; gap: 4px; flex-wrap: wrap; align-content: start; }
  .rod { width: 9px; height: 44px; border: 1px solid #335cc0; border-radius: 2px; background: #dbe6ff; }
  .one { width: 11px; height: 11px; border: 1px solid #335cc0; border-radius: 2px; background: #dbe6ff; }
  .rods .move-origin { background: #ffbf98; border-color: #96320d; }
  .ones, .rods { min-height: 44px; }
  .groups { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 4px; }
  .group { min-width: 0; min-height: 54px; border-radius: 5px; background: white; border: 1px solid #a9bae7; padding: 4px; }
  .group .rods { min-height: 24px; gap: 2px; }
  .group .rod { height: 22px; width: 5px; }
  .notation { justify-self: center; text-align: right; font-size: 20px; font-variant-numeric: tabular-nums; }
  .notation span { display: block; }
  .notation .hint { color: var(--blue); font-size: 14px; }
  .subtract { border-bottom: 2px solid var(--ink); padding: 0 3px; }
  .long-division strong { padding: 3px; border-left: 2px solid var(--ink); border-top: 2px solid var(--ink); }
  .action { display: grid; gap: 6px; }
  .desk-footer label { flex: 1; min-width: 140px; }
  .desk-footer input { width: 100%; min-width: 0; }
  .desk-footer output { width: 100%; color: var(--subtle); font-size: 13px; }
  .screen[data-layout="paper"] .desk-workspace { grid-template-areas: "question question" "help board" "controls controls" "nav nav"; }
  .screen[data-layout="paper"] .question { padding-block: 20px; background: var(--peach); }
  .screen[data-layout="practice"] .action { grid-row: 2; padding: 8px; background: var(--peach); border-radius: 8px; }
  .screen[data-paper="true"] .canvas { display: none; }
  .screen[data-paper="true"] .action { grid-row: auto; }
  .screen [hidden] { display: none; }
  .fonts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; }
  .sample { margin: 0; padding: 9px; border: 1px solid var(--border, #d4d4d8); border-radius: 8px; min-width: 0; }
  .sample figcaption { font-size: 13px; }
  .sample svg { display: block; width: 100%; max-width: 215px; margin: auto; color: #1b3371; background: white; border-radius: 6px; }
  .sample text { font-family: Arial, sans-serif; font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @container (max-width: 550px) {
    .screen[data-layout] .desk-workspace { grid-template-columns: minmax(0, 1fr); grid-template-areas: "question" "board" "controls" "help" "nav"; gap: 8px; padding: 8px; }
    .screen[data-layout="paper"] .question { padding-block: 12px; }
    .screen[data-layout="paper"] .desk-workspace { grid-template-areas: "question" "help" "board" "controls" "nav"; }
    .desk-top, .desk-footer { padding: 6px 8px; }
  }
</style>
<main>
  <h2>Lesson layout</h2>
  <div class="options" aria-label="Layout options" role="group">
    <button type="button" data-option="board" aria-pressed="true">A · Board-led</button>
    <button type="button" data-option="paper" aria-pressed="false">B · Paper companion</button>
    <button type="button" data-option="practice" aria-pressed="false">C · Interactive practice</button>
  </div>
  <p class="choice-copy" id="choice-copy">The board stays open. The child can switch to paper at any step.</p>
  <div class="options">
    <label>Example <select id="scenario"><option value="subtract">52 − 28</option><option value="divide">84 ÷ 4</option></select></label>
    <label>Screen <select id="size"><option value="desktop">Desktop</option><option value="phone">Phone</option></select></label>
    <label>Motion <select id="motion"><option value="system">Device setting</option><option value="reduce">Reduced</option></select></label>
  </div>

  <section class="screen" aria-label="Lesson prototype" data-layout="board" data-size="desktop" data-paper="false">
    <header class="desk-top">
      <span class="person"><img src="../../../public/desk/maya.webp" alt="">Maya</span>
      <span class="desk-status" id="desk-status" role="status">Chat</span>
      <button class="leave" type="button" id="leave">Leave desk</button>
    </header>
    <div class="desk-workspace">
      <section class="question" aria-label="Current question">
        <div><small>Workbook 1</small><h3 class="equation" id="equation">52 − 28</h3></div>
        <button type="button" id="paper-toggle" aria-pressed="false">Use paper</button>
      </section>

      <section class="teaching" aria-labelledby="board-title">
        <h3 id="board-title">Our board</h3>
        <div class="canvas" id="canvas">
          <div id="representation"></div>
          <p id="notation" class="notation"></p>
        </div>
        <p id="paper-note" hidden>Write this step in your workbook. You can still ask Maya for help.</p>
        <div class="action"><p id="instruction"></p><button type="button" class="primary" id="step"></button></div>
      </section>

      <footer class="desk-footer">
        <button type="button" id="mic" aria-pressed="false">Microphone</button>
        <label><span class="sr-only">Reply</span><input id="reply" placeholder="Write to Maya"></label>
        <button type="button" id="send">Send</button>
        <output id="status" role="status"></output>
      </footer>

      <aside class="prompt">
        <h3>Maya says</h3>
        <p id="cue"></p>
        <details><summary>Transcript</summary><p id="transcript"></p></details>
      </aside>

      <details class="desk-nav">
        <summary>Workbook navigation</summary>
        <div class="nav-items">
          <button type="button" data-example="subtract">52 − 28</button>
          <button type="button" data-example="divide">84 ÷ 4</button>
        </div>
      </details>
    </div>
  </section>

  <h2>Math lettering</h2>
  <div class="fonts" id="fonts"></div>
</main>
<script>
  const screen = document.querySelector(".screen");
  const byId = (id) => document.getElementById(id);
  const choices = {
    board: "The board stays open. The child can switch to paper at any step.",
    paper: "The question and Maya’s prompt lead. The board sits beside the prompt or below it on a phone.",
    practice: "The child’s next action sits directly below the board title. The child can review the model at the same step."
  };
  const problems = {
    subtract: {
      equation: "52 − 28",
      instruction: "Trade one ten for ten ones.",
      action: "Trade 1 ten",
      after: "Now you have 4 tens and 12 ones. The total is still 52.",
      cue: "There are two ones. How can you get enough ones to take away eight?"
    },
    divide: {
      equation: "84 ÷ 4",
      instruction: "Share the eight tens among four groups.",
      action: "Share the tens",
      after: "Each group now has 2 tens. Four ones still need to be shared.",
      cue: "Start with the tens. How many tens can each of the four groups get?"
    }
  };
  let completed = false;
  let finished = false;

  function blocks(count, type, highlightLast = false) {
    return Array.from({ length: count }, (_, index) =>
      '<i aria-hidden="true" class="' + type + (highlightLast && index === count - 1 ? ' move-origin' : '') + '"></i>'
    ).join("");
  }

  function drawProblem() {
    const key = byId("scenario").value;
    const problem = problems[key];
    const paper = screen.dataset.paper === "true";
    byId("equation").textContent = problem.equation;
    byId("cue").textContent = completed ? problem.after : problem.cue;
    byId("transcript").textContent = problem.cue + (completed ? " " + problem.after : "");
    byId("instruction").textContent = completed ? problem.after : problem.instruction;
    byId("step").textContent = completed ? "Reset example" : paper ? "I did this on paper" : problem.action;
    if (key === "subtract") {
      const tens = completed ? 4 : 5;
      const ones = completed ? 12 : 2;
      byId("representation").innerHTML = '<div class="block-zones"><div class="zone"><strong>' + tens +
        ' tens</strong><div class="rods">' + blocks(tens, "rod", !completed) +
        '</div></div><div class="zone"><strong>' + ones + ' ones</strong><div class="ones">' +
        blocks(ones, "one") + '</div></div></div>';
      byId("notation").innerHTML = '<span class="hint">' + (completed ? "4 tens · 12 ones" : "Tens · ones") +
        '</span><span>5&nbsp;2</span><span class="subtract">−&nbsp;2&nbsp;8</span>';
    } else {
      const unshared = completed ? 0 : 8;
      const groups = Array.from({ length: 4 }, (_, index) =>
        '<div class="group"><span class="sr-only">Group ' + (index + 1) + (completed ? ', 2 tens' : ', empty') +
        '</span><div class="rods">' + blocks(completed ? 2 : 0, "rod") + '</div></div>'
      ).join("");
      byId("representation").innerHTML =
        '<div class="zone"><strong>' + unshared + ' tens and 4 ones to share</strong><div class="rods">' +
        blocks(unshared, "rod", !completed) + blocks(4, "one") + '</div></div>' +
        '<div class="groups" aria-label="Four groups">' + groups + '</div>';
      byId("notation").innerHTML = '<span class="hint">' + (completed ? "2 tens in each group" : "Four equal groups") +
        '</span><span class="long-division">4 <strong>84</strong></span>';
    }
  }

  for (const button of document.querySelectorAll("[data-option]")) {
    button.addEventListener("click", () => {
      screen.dataset.layout = button.dataset.option;
      byId("choice-copy").textContent = choices[button.dataset.option];
      for (const option of document.querySelectorAll("[data-option]")) {
        option.setAttribute("aria-pressed", String(button === option));
      }
    });
  }

  byId("size").addEventListener("change", () => { screen.dataset.size = byId("size").value; });
  byId("scenario").addEventListener("change", () => {
    completed = false;
    byId("status").textContent = "";
    drawProblem();
  });
  for (const button of document.querySelectorAll("[data-example]")) {
    button.addEventListener("click", () => {
      byId("scenario").value = button.dataset.example;
      byId("scenario").dispatchEvent(new Event("change"));
    });
  }
  byId("paper-toggle").addEventListener("click", () => {
    const paper = screen.dataset.paper !== "true";
    screen.dataset.paper = String(paper);
    byId("paper-toggle").setAttribute("aria-pressed", String(paper));
    byId("paper-toggle").textContent = paper ? "Show board" : "Use paper";
    byId("paper-note").hidden = !paper;
    drawProblem();
  });
  byId("step").addEventListener("click", () => {
    const origin = byId("representation").querySelector(".move-origin")?.getBoundingClientRect();
    const noMotion = matchMedia("(prefers-reduced-motion: reduce)").matches || byId("motion").value === "reduce";
    completed = !completed;
    drawProblem();
    byId("status").textContent = completed ? problems[byId("scenario").value].after : "";
    if (completed && !noMotion && origin && screen.dataset.paper === "false") {
      const destination = byId("representation").querySelector(".ones .one:nth-child(3), .group .rod");
      const next = destination?.getBoundingClientRect();
      if (next) {
        destination.animate([
          { transform: "translate(" + (origin.x - next.x) + "px," + (origin.y - next.y) + "px)", backgroundColor: "#ffbf98" },
          { transform: "translate(0,0)" }
        ], { duration: 260, easing: "ease-out" });
      }
    }
  });
  byId("mic").addEventListener("click", () => {
    const pressed = byId("mic").getAttribute("aria-pressed") !== "true";
    byId("mic").setAttribute("aria-pressed", String(pressed));
    byId("desk-status").textContent = pressed ? "Call · Listening" : "Chat";
  });
  function sendReply() {
    const reply = byId("reply");
    if (reply.value.trim()) {
      byId("status").textContent = "Reply sent in prototype";
      reply.value = "";
    }
  }
  byId("send").addEventListener("click", sendReply);
  byId("reply").addEventListener("keydown", (event) => { if (event.key === "Enter") sendReply(); });
  byId("leave").addEventListener("click", () => {
    finished = !finished;
    byId("leave").textContent = finished ? "Resume preview" : "Leave desk";
    screen.querySelector(".desk-workspace").hidden = finished;
    byId("desk-status").textContent = finished ? "Lesson ended in prototype" : "Chat";
    byId("mic").setAttribute("aria-pressed", "false");
  });
