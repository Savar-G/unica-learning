<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="shared.css"><script src="content.js"></script>
<style>
.grid{display:grid;grid-template-columns:1.25fr 1fr 1fr 1fr;gap:12px;align-items:stretch}
.card{background-color:var(--card);border-radius:6px;padding:22px 20px 24px}
.card h3{margin:0 0 18px;font:400 12.5px/1.3 "Geist Mono",monospace;letter-spacing:.02em;color:var(--ink-3);min-height:34px}
.card dl{margin:0;display:grid;gap:16px}
.card dt{font:400 11.5px/1.3 "Geist Mono",monospace;color:var(--ink-3);letter-spacing:.02em}
.card dd{margin:4px 0 0;font-size:15px;line-height:1.4;color:var(--ink-2)}
.card.us{background-color:#fff;box-shadow:0 0 0 1px var(--line),0 12px 32px rgba(12,12,14,.08);transform:translateY(-10px);padding:26px 24px 30px}
.card.us h3{font:500 18px/1.3 "Geist",sans-serif;color:var(--ink);letter-spacing:-.01em}
.card.us dd{font-size:16.5px;color:var(--ink);font-weight:500}
@media (max-width:760px){.grid{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;margin:0 -16px;padding:14px 16px 6px}.card{flex:0 0 82%;scroll-snap-align:start}.card.us{transform:none}.hint{display:block!important}}
.hint{display:none;margin-top:10px;color:var(--ink-3)}
</style></head><body><span class="tag">B · Plan-style cards</span>
<p class="eyebrow">How we're different</p><h2 id="t"></h2>
<div class="grid" id="g"></div><p class="hint mono">Swipe to compare →</p>
<script>const c=CMP;t.textContent=c.title;
const card=(name,vals,us)=>`<div class="card${us?" us wash":""}"><h3 class="${us?"brand":""}">${name}</h3><dl>${c.rows.map((r,i)=>`<div><dt>${r[0]}</dt><dd>${vals[i]}</dd></div>`).join("")}</dl></div>`;
g.innerHTML=card(c.us,c.rows.map(r=>r[2]),1)+c.cols.map((n,j)=>card(n,c.rows.map(r=>r[1][j]),0)).join("");</script></body></html>
