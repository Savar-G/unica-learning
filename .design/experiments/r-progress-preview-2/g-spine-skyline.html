<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>G. Spine skyline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
.poster { margin-top: 28px; padding: clamp(24px, 4vw, 56px); border-radius: 20px; background: #0c0c0e; color: #fff; overflow: hidden; }
.poster .k { color: #a0a0aa; }
.big { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 18px; margin-top: 10px; font-size: clamp(44px, 7vw, 96px); font-weight: 300; line-height: .95; letter-spacing: -.045em; }
.big .from { color: #6b6b74; }
.big .arrow { font-size: .6em; color: #6b6b74; }
.big .by { font-size: .3em; letter-spacing: -.02em; color: #d6d6dc; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 14px; margin-top: 20px; }
.poster .pace { background: #1c1c20; box-shadow: none; }
.poster .pace-k { color: #a0a0aa; }
.poster .pace button { color: #fff; }
.poster .pace button[aria-pressed="true"] { background: #fff; color: #0c0c0e; }
.sky { margin-top: 26px; }
.sky svg { display: block; width: 100%; height: auto; }
.sky text { font-family: "Geist Mono", monospace; }
.sp { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: rise .55s var(--d) cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes rise { to { transform: scaleY(1); } }
.leg { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 16px; margin-top: 22px; padding-top: 18px; border-top: 1px solid #2a2a30; }
.leg b { display: flex; align-items: center; gap: 8px; font-weight: 500; }
.leg b i { width: 10px; height: 10px; background: var(--c); }
.leg p { margin-top: 6px; font-size: 14px; line-height: 1.45; color: #b8b8c0; }
.poster .basis { color: #a0a0aa; }
@media (max-width: 700px) { .leg { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="chrome"><span class="v">G. Spine skyline</span><div class="cases" data-cases></div><a href="board.html">All options</a></div>
<main class="page">
  <div class="stub">Report: "Where Leah is", "What's in workbook 1" (unchanged)</div>
  <section class="section" id="out"></section>
  <div class="stub">Next step: card and plan button (unchanged)</div>
</main>
<script src="levels.js"></script><script src="pace.js"></script><script src="covers.js"></script>
<script>
mount((p, setPace) => {
  const W = 1000, H = 330, L = 0, R = 90, T = 30, B = 34;
  const n = p.books.length, gap = 5;
  const bw = (W - L - R - gap * (n - 1)) / n;
  const steps = p.goal - p.c.working;
  const base = 70, rise = (H - T - B - base) / (steps + 0.4);
  const spines = p.books.map((b, i) => {
    const within = b.n - p.books.find((x) => x.grade === b.grade).n; // book index inside its grade
    const count = p.books.filter((x) => x.grade === b.grade).length;
    const h = base + (b.grade - p.c.working) * rise + (within / count) * rise * 0.85;
    const bx = L + i * (bw + gap), by = H - B - h;
    const c = gradeColor(b.grade);
    return `<g class="sp" style="--d:${(i * 0.035).toFixed(2)}s"><title>Book ${b.n}: ${b.title}</title>
      <rect x="${bx}" y="${by}" width="${bw}" height="${h}" rx="3" fill="${b.n === 1 ? c : "#1c1c20"}" stroke="${c}" stroke-width="1.5"/>
      <rect x="${bx + 3}" y="${by + 6}" width="${bw - 6}" height="${Math.min(bw - 6, 14)}" fill="${c}" opacity="${b.n === 1 ? 0 : .9}"/>
      <text x="${bx + bw / 2}" y="${H - B - 10}" text-anchor="middle" font-size="${bw > 26 ? 11 : 9}" fill="${b.n === 1 ? "#0c0c0e" : "#8a8a93"}">${b.n}</text>
      ${b.test ? `<text x="${bx + bw / 2}" y="${by - 6}" text-anchor="middle" font-size="9" fill="#8a8a93">test</text>` : ""}</g>`;
  }).join("");
  // goal tower: a flag on a pole after the last book
  const gx = W - R + 30, gy = H - B - (base + steps * rise + rise * 0.6);
  const goal = `<g class="sp" style="--d:${(n * 0.035 + .1).toFixed(2)}s"><rect x="${gx}" y="${gy}" width="4" height="${H - B - gy}" fill="#fff"/><path d="M${gx + 4} ${gy}h30l-8 9 8 9h-30z" fill="#fff"/></g>
    <text x="${gx + 2}" y="${H - B + 22}" text-anchor="middle" font-size="11" fill="#fff">${monthShort(p.goalDate)} ${String(p.goalDate.getFullYear()).slice(2)}</text>`;
  // month labels at each grade's first book
  const marks = p.grades.slice(0, -1).map((s) => { const i = s.books[0].n - 1; const bx = L + i * (bw + gap); return `<line x1="${bx}" x2="${bx}" y1="${H - B + 4}" y2="${H - B + 12}" stroke="#6b6b74"/><text x="${bx}" y="${H - B + 26}" font-size="11" fill="#a0a0aa">${monthShort(s.date)} ${String(s.date.getFullYear()).slice(2)}</text>`; }).join("");
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${headline(p)}"><line x1="0" x2="${W}" y1="${H - B}" y2="${H - B}" stroke="#3a3a40"/>${spines}${goal}${marks}</svg>`;
  const leg = p.grades.slice(0, -1).map((s) => `<div style="--c:${gradeColor(s.grade)}"><b><i></i>${gradeName(s.grade)} work · books ${s.books[0].n} to ${s.books.at(-1).n}</b><p>${s.levels.map((l) => l.title).join(" · ")}</p></div>`).join("");
  const out = document.getElementById("out");
  out.innerHTML = `
    <div class="poster">
      <p class="k">Where ${p.c.name} can go</p>
      <p class="big"><span class="from">${gradeName(p.c.working)}</span><span class="arrow">→</span><span>${gradeName(p.goal)}</span><span class="by">by about ${monthYear(p.goalDate)}</span></p>
      <div class="row"><p style="max-width:34em;color:#d6d6dc">${headline(p)}</p>${paceSwitch(p)}</div>
      <div class="sky">${svg}</div>
      <div class="leg" style="--n:${p.grades.length - 1}">${leg}</div>
      <p class="basis">${basis(p)}</p>
    </div>`;
  wirePace(out, setPace);
});
</script>
</body>
</html>
