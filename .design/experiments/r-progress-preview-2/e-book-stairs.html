<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>E. Book stairs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
.card { margin-top: 28px; padding: clamp(18px, 3vw, 36px); border-radius: 18px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 30px 60px -40px rgba(0,0,0,.35); }
.card-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.stat { display: flex; gap: clamp(16px, 3vw, 36px); }
.stat div { font: 400 12px/1.3 var(--mono); color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.stat b { display: block; margin-top: 4px; font: 400 26px/1 var(--sans); letter-spacing: -.03em; color: var(--ink); text-transform: none; }
.chart { margin-top: 20px; overflow: hidden; }
.chart svg { display: block; width: 100%; height: auto; }
.chart text { font-family: "Geist Mono", monospace; }
.bk { opacity: 0; animation: up .5s var(--d) cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.stair { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.4s cubic-bezier(.4,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.topics { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 0; margin-top: 8px; border-top: 1px solid var(--line); }
.topics > div { padding: 16px 16px 4px 0; }
.topics > div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.topics .gk { display: flex; align-items: center; gap: 8px; font: 500 15px/1.2 var(--sans); }
.topics .gk i { width: 10px; height: 10px; background: var(--c); outline: 1px solid #0c0c0e; }
.topics .when { margin-top: 2px; font: 400 12px/1.3 var(--mono); color: var(--ink-2); }
.topics ul { margin: 10px 0 0; padding: 0; list-style: none; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.topics li + li { margin-top: 3px; }
@media (max-width: 700px) { .topics { grid-template-columns: 1fr; } .topics > div + div { padding-left: 0; border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<div class="chrome"><span class="v">E. Book stairs</span><div class="cases" data-cases></div><a href="board.html">All options</a></div>
<main class="page">
  <div class="stub">Report: "Where Leah is", "What's in workbook 1" (unchanged)</div>
  <section class="section" id="out"></section>
  <div class="stub">Next step: card and plan button (unchanged)</div>
</main>
<script src="levels.js"></script><script src="pace.js"></script><script src="covers.js"></script>
<script>
mount((p, setPace) => {
  const W = 1000, H = 400, L = 20, R = 200, T = 70, B = 40;
  const t0 = REPORT_DATE.getTime(), t1 = p.goalDate.getTime();
  const x = (d) => L + (d.getTime() - t0) / (t1 - t0) * (W - L - R);
  const steps = p.grades.length - 1;
  const stepH = (H - T - B) / steps;
  const y = (i) => H - B - i * stepH; // shelf of the i-th grade on the way
  // staircase path: each grade's shelf, then the riser to the next
  let d = `M${x(p.grades[0].date)} ${y(0)}`;
  p.grades.forEach((s, i) => {
    const end = i < steps ? x(p.grades[i + 1].date) : W - 30;
    d += ` H${end}` + (i < steps ? ` V${y(i + 1)}` : "");
  });
  const len = (W - L) + (H - T - B);
  // books standing on their shelf
  let books = "";
  p.grades.slice(0, -1).forEach((s, i) => {
    const span = (i < steps ? x(p.grades[i + 1].date) : W) - x(s.date);
    const bw = Math.min(30, span / s.books.length * 0.78), bh = bw * 11 / 8.5;
    s.books.forEach((b, j) => {
      const bx = x(b.start) + (span / s.books.length - bw) / 2, by = y(i) - bh - 1;
      const first = b.n === 1;
      books += `<g class="bk" style="--d:${(0.4 + b.n * 0.04).toFixed(2)}s"><title>Book ${b.n}: ${b.title}</title>
        <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="#fff" stroke="${first ? "#0c0c0e" : "#c9c9cf"}" stroke-width="${first ? 1.6 : 1}" rx="1.5"/>
        ${gridSvg(s.grade, bw * 0.42, bx + bw * 0.14, by + bh * 0.12)}
        <rect x="${bx + bw * 0.14}" y="${by + bh * 0.66}" width="${bw * 0.62}" height="${Math.max(2, bh * 0.08)}" fill="${BRAND.sun}"/>
        ${b.test ? `<text x="${bx + bw / 2}" y="${by - 6}" text-anchor="middle" font-size="10" fill="#44444c">test</text>` : ""}
      </g>`;
    });
  });
  const school = p.c.grade > p.c.working && p.c.grade <= p.goal ? (() => { const i = p.c.grade - p.c.working; return `<line x1="${L}" x2="${W - 10}" y1="${y(i) - 0.5}" y2="${y(i) - 0.5}" stroke="${BRAND.tang}" stroke-width="1.5" stroke-dasharray="5 6" opacity=".9"/><text x="${L + 14}" y="${y(i) + 18}" font-size="12" fill="#a8360f">${p.c.name}'s school grade today</text>`; })() : "";
  const labels = p.grades.map((s, i) => i < steps ? `<text x="${x(s.date) + 2}" y="${y(i) + 22}" font-size="13" fill="#0c0c0e" font-weight="500">${gradeName(s.grade)} work</text><text x="${x(s.date) + 2}" y="${y(i) + 38}" font-size="11" fill="#8a8a93">from ${monthShort(s.date)} ${s.date.getFullYear()}</text>` : "").join("");
  const gx = x(p.goalDate), gy = y(steps);
  const goal = `<g transform="translate(${gx + 6} ${gy - 58})"><path d="M2 58V2" stroke="#0c0c0e" stroke-width="3" stroke-linecap="round"/><path d="M3 3h30l-8 9 8 9H3z" fill="#0c0c0e"/></g>
    <text x="${gx + 46}" y="${gy - 30}" font-size="16" font-weight="600" fill="#0c0c0e" font-family="Geist">${gradeName(p.goal)} level</text>
    <text x="${gx + 46}" y="${gy - 12}" font-size="12" fill="#44444c">about ${monthShort(p.goalDate)} ${p.goalDate.getFullYear()}</text>`;
  const b1 = x(START_DATE), tx = x(REPORT_DATE);
  const today = `<line x1="${tx}" x2="${tx}" y1="${T - 30}" y2="${H - B}" stroke="#0c0c0e" stroke-width="1" stroke-dasharray="2 4"/>
    <circle cx="${tx}" cy="${T - 30}" r="5" fill="${BRAND.leaf}"/><text x="${tx + 10}" y="${T - 26}" font-size="12" font-weight="600" fill="#0c0c0e">TODAY</text>`;
  const svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${headline(p)}">${school}${today}
    <path class="stair" d="${d}" fill="none" stroke="#0c0c0e" stroke-width="3" stroke-linejoin="round" style="--len:${len}"/>
    ${books}${labels}${goal}</svg>`;
  const topics = p.grades.slice(0, -1).map((s) => `<div style="--c:${gradeColor(s.grade)}"><p class="gk"><i></i>${gradeName(s.grade)} work</p><p class="when">Books ${s.books[0].n} to ${s.books.at(-1).n}</p><ul>${s.levels.map((l) => `<li>${l.title}</li>`).join("")}</ul></div>`).join("");
  const out = document.getElementById("out");
  out.innerHTML = `
    <div class="section-head"><p class="k">Where ${p.c.name} can go</p><h2>${headline(p)}</h2></div>
    <div class="card">
      <div class="card-top"><div class="stat"><div>Goal<b>${gradeName(p.goal)}</b></div><div>By about<b>${monthShort(p.goalDate)} ${p.goalDate.getFullYear()}</b></div><div>Books<b>${p.books.length}</b></div></div>${paceSwitch(p)}</div>
      <div class="chart">${svg}</div>
      <div class="topics" style="--n:${steps}">${topics}</div>
      <p class="basis">${basis(p)}</p>
    </div>`;
  wirePace(out, setPace);
});
</script>
</body>
</html>
