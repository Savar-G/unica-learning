<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>B - The whole map</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono&family=Caveat:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
.map{display:grid;grid-template-columns:120px repeat(3,1fr);border-top:1px solid var(--line)}
.map > div{padding:18px 18px 22px;border-bottom:1px solid var(--line)}
.map .ages{position:relative;padding-top:30px}
.map .ages b{display:block;font-weight:400;font-size:22px;letter-spacing:-.02em}
.map .ages .mono{color:var(--ink-3)}
/* pencil line along the top: progression from 6 to 12 */
.rail{grid-column:2 / 5;position:relative;height:0;padding:0!important;border:0!important}
.rail svg{position:absolute;left:0;right:0;top:-1px;width:100%;height:30px;overflow:visible}
.rail path{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-dasharray:1200;stroke-dashoffset:1200;animation:draw 2.2s .3s cubic-bezier(.6,0,.2,1) forwards}
.rail text{font:500 21px "Caveat",cursive;fill:var(--accent);opacity:0;animation:fade .6s 2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes fade{to{opacity:1}}
.subj{display:flex;gap:10px;align-items:center;font-size:19px;font-weight:500;letter-spacing:-.01em}
.subj .sq{background:var(--c)}
.cell ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.cell li{font-size:15.5px;line-height:1.35;color:var(--ink);padding-left:16px;position:relative}
.cell li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;background:var(--c)}
.cell{transition:background .25s}.cell:hover{background:var(--card)}
.m{--c:var(--g1)}.r{--c:var(--g3)}
.mob{display:none}
@media (max-width:860px){
  .map{display:none}.mob{display:grid;gap:12px}
  details{background:var(--card);border-radius:4px;padding:0 20px}
  summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;padding:18px 0}
  summary::-webkit-details-marker{display:none}
  summary b{font-weight:400;font-size:22px;letter-spacing:-.02em}
  summary::after{content:"+";font-size:22px;color:var(--ink-3)}details[open] summary::after{content:"−"}
  details .subj{font-size:16px;margin:4px 0 10px}
  details ul{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:8px}
  details li{font-size:15.5px;padding-left:16px;position:relative}
  details li::before{content:"";position:absolute;left:0;top:.55em;width:6px;height:6px;background:var(--c)}
}
</style></head><body>
<div class="tag">B · The whole map</div>
<div id="head"></div>
<div class="map" id="map"></div>
<div class="mob" id="mob"></div>
<div id="prov"></div>
<script src="content.js"></script>
<script>
head.innerHTML = HEAD; prov.innerHTML = PROV;
const ul = a => `<ul>${a.map(t=>`<li>${t}</li>`).join("")}</ul>`;
map.innerHTML = `<div style="border:0"></div><div class="rail"><svg viewBox="0 0 1000 30" preserveAspectRatio="none"><path d="M10 16 C 300 10, 700 22, 985 14"/></svg></div>`
 + `<div></div>` + BANDS.map(b=>`<div class="ages"><b>${b.age}</b><span class="mono">${b.grade}</span></div>`).join("")
 + `<div class="m"><div class="subj"><span class="sq"></span>Math</div></div>` + BANDS.map(b=>`<div class="cell m">${ul(b.math)}</div>`).join("")
 + `<div class="r"><div class="subj"><span class="sq"></span>Reading</div></div>` + BANDS.map(b=>`<div class="cell r">${ul(b.reading)}</div>`).join("");
mob.innerHTML = BANDS.map((b,i)=>`<details ${i===1?"open":""}><summary><b>${b.age}</b><span class="mono" style="color:var(--ink-3)">${b.grade}</span></summary>
  <div class="m"><div class="subj"><span class="sq"></span>Math</div>${ul(b.math)}</div>
  <div class="r"><div class="subj"><span class="sq"></span>Reading</div>${ul(b.reading)}</div></details>`).join("");
</script>
</body></html>
