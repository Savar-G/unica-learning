<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin, option C: Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;450;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="shared.css">
<style>
  /* ---------- option C: board ---------- */
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .sec-head { display: flex; align-items: baseline; gap: var(--s3); flex-wrap: wrap; margin: 0 0 var(--s3); }
  .sec-head h2 { margin: 0; font: 400 19px/1.2 var(--sans); letter-spacing: -0.02em; }
  .sec-head .more { margin-left: auto; font-size: 13.5px; color: var(--ink-2); text-decoration: none; }
  .sec-head .more:hover { color: var(--ink); text-decoration: underline; }
  .focus-note { font-size: 13px; color: var(--ink-2); }
  .focus-note button { border: 0; background: none; padding: 0 0 0 var(--s1); text-decoration: underline; cursor: pointer; color: var(--ink); }

  /* job counters */
  .jobs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--s3); margin-bottom: var(--s6); }
  .job { position: relative; display: grid; gap: var(--s1); min-height: 112px; padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r); background: var(--soft); text-align: left; cursor: pointer; transition: border-color .15s, background .15s, box-shadow .15s; }
  .job:hover { border-color: #c9c9cf; background: #fff; }
  .job[aria-pressed="true"] { background: #fff; border-color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .job .k { display: flex; align-items: center; gap: var(--s2); font: 400 11px/1.2 var(--mono); letter-spacing: .05em; text-transform: uppercase; color: var(--ink-2); }
  .job .k::before { content: ""; width: 8px; height: 8px; background: var(--c, var(--accent)); }
  .job .v { font: 300 38px/1 var(--sans); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; margin-top: var(--s2); }
  .job .s { font-size: 13px; color: var(--ink-2); }
  .job .vrow { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--s2); }
  .job svg.spark { width: 76px; height: 28px; overflow: visible; flex: none; }

  /* boards */
  .board { display: grid; grid-auto-flow: column; grid-auto-columns: calc((100% - 4 * var(--s3)) / 5); gap: var(--s3); overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: var(--s2); scrollbar-width: thin; }
  .col { scroll-snap-align: start; display: flex; flex-direction: column; min-width: 0; min-height: 240px; border: 1px solid var(--line-soft); border-radius: var(--r); background: var(--soft); }
  .col-head { display: flex; align-items: center; gap: var(--s2); height: 48px; padding: 0 var(--s3); border-bottom: 1px solid var(--line-soft); }
  .col-head h2, .col-head h3 { margin: 0; font: 500 13.5px/1.2 var(--sans); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .n { margin-left: auto; min-width: 24px; padding: 3px 7px; border-radius: 999px; background: #fff; border: 1px solid var(--line); font: 500 12px/1 var(--sans); text-align: center; font-variant-numeric: tabular-nums; }
  .col-head .n.zero { color: var(--ink-3); }
  .col-head .plus { font: 400 11px/1 var(--mono); color: var(--ink-3); white-space: nowrap; }
  .tone { width: 8px; height: 8px; border-radius: 2px; flex: none; background: #c9c9cf; }
  .tone.info { background: var(--sky); } .tone.warn { background: var(--sun); } .tone.ok { background: var(--leaf); } .tone.act { background: var(--accent); }
  .col ul { list-style: none; margin: 0; padding: var(--s2); display: grid; gap: var(--s2); align-content: start; }
  .empty { flex: 1; display: grid; place-items: center; margin: var(--s2); padding: var(--s5) var(--s3); border: 1px dashed var(--line); border-radius: 6px; color: var(--ink-3); font-size: 13px; text-align: center; }

  /* cards */
  .fcard { position: relative; padding: var(--s3); border: 1px solid var(--line); border-radius: 6px; background: #fff; transition: opacity .15s, outline-color .15s; outline: 2px solid transparent; outline-offset: -1px; }
  .fcard.is-act { box-shadow: inset 3px 0 0 var(--accent); }
  .fcard.is-test { background: repeating-linear-gradient(135deg, #fff 0 10px, var(--soft) 10px 20px); }
  .is-focus .fcard:not(.is-hl) { opacity: .35; }
  .fcard.is-hl { outline-color: var(--ink); }
  .fc-top { display: flex; gap: var(--s2); align-items: flex-start; }
  .fc-who { flex: 1; min-width: 0; }
  .fc-who a { display: block; font: 500 14px/1.3 var(--sans); text-decoration: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc-who a:hover { text-decoration: underline; }
  .fc-kids { font-size: 12.5px; line-height: 1.4; color: var(--ink-2); }
  .fc-note { margin: var(--s2) 0 0; font-size: 13px; line-height: 1.45; color: var(--ink-2); }
  .fc-meta { display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; margin-top: var(--s2); }
  .since { font: 400 11px/1.2 var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .tag { display: inline-flex; align-items: center; gap: 5px; padding: 2px 6px; border-radius: 4px; font: 500 10.5px/1.3 var(--mono); letter-spacing: .04em; text-transform: uppercase; }
  .tag.new { background: var(--accent-soft); color: #a8380f; }
  .tag.live { background: var(--info); color: #23458f; }
  .pulse { position: relative; width: 6px; height: 6px; border-radius: 50%; background: var(--sky); }
  .pulse::after { content: ""; position: absolute; inset: -3px; border-radius: 50%; border: 1.5px solid var(--sky); animation: pulse 1.6s ease-out infinite; }
  @keyframes pulse { from { transform: scale(.5); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; opacity: .5; } }
  .fcard .btn { width: 100%; justify-content: center; margin-top: var(--s3); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--s1); margin-top: var(--s2); }
  .chips .chip { font-size: 12px; padding: 2px 8px; }
  .bar { display: flex; align-items: center; gap: var(--s2); margin-top: var(--s2); }
  .bar i { flex: 1; height: 6px; border-radius: 999px; background: var(--line-soft); overflow: hidden; }
  .bar i b { display: block; height: 100%; border-radius: 999px; background: var(--sky); }
  .bar span { font: 500 12px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .tries { margin-top: var(--s2); font-size: 12.5px; color: var(--ink-2); }
  .tries summary { cursor: pointer; width: fit-content; text-decoration: underline dotted; text-underline-offset: 3px; min-height: 24px; display: flex; align-items: center; }
  .tries ol { margin: var(--s2) 0 0; padding: 0; list-style: none; display: grid; gap: var(--s2); }
  .tries li { padding-left: var(--s3); border-left: 2px solid var(--line); line-height: 1.4; }
  .tries li b { font-weight: 500; color: var(--ink); }

  /* waitlist lane */
  .lane { display: flex; align-items: center; gap: var(--s3); flex-wrap: wrap; margin-top: var(--s3); padding: var(--s2) var(--s3); border: 1px dashed var(--line); border-radius: var(--r); font-size: 13px; color: var(--ink-2); }
  .lane .k { display: flex; align-items: center; gap: var(--s2); font: 400 11px/1 var(--mono); letter-spacing: .05em; text-transform: uppercase; }
  .lane ul { display: flex; flex-wrap: wrap; gap: var(--s2); list-style: none; margin: 0; padding: 0; }
  .lane li { display: inline-flex; align-items: center; gap: var(--s2); min-height: 40px; }
  .lane li a { text-decoration: none; color: var(--ink); font-weight: 500; }
  .lane .avatar { width: 24px; height: 24px; font-size: 11px; }

  /* below the board */
  .lower { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: var(--s6); margin-top: var(--s7); }
  .rows { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .rows > li { display: grid; align-items: center; gap: var(--s3); min-height: 56px; padding: var(--s3) 0; border-bottom: 1px solid var(--line-soft); }
  .q { grid-template-columns: auto minmax(0, 1fr) auto auto; }
  .q .where { font-size: 13.5px; } .q .where small { display: block; font-size: 12.5px; color: var(--ink-3); }
  .q .read { font: 500 13px/1 var(--mono); padding: 6px 8px; border-radius: 4px; background: var(--card); white-space: nowrap; }
  .q .btn { height: 36px; }
  .qsum { display: flex; align-items: center; gap: var(--s3); margin-bottom: var(--s3); font-size: 13px; color: var(--ink-2); }
  .qsum .bar { flex: 1; max-width: 220px; margin: 0; }
  .qsum .bar i b { background: var(--leaf); }
  .act { grid-template-columns: 64px 8px minmax(0, 1fr); }
  .act time { font: 400 12px/1.3 var(--mono); color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .act .dot { width: 8px; height: 8px; border-radius: 2px; }
  .act p { margin: 0; font-size: 13.5px; } .act p small { display: block; font-size: 12.5px; color: var(--ink-3); }
  .act a { text-decoration: none; font-weight: 500; } .act a:hover { text-decoration: underline; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: var(--accent-soft); } to { background: transparent; } }

  /* production: stage rail and view switch */
  .seg { display: inline-flex; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--soft); }
  .seg button { height: 32px; padding: 0 var(--s3); border: 0; border-radius: 6px; background: transparent; font: 500 13px/1 var(--sans); color: var(--ink-2); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(0,0,0,.05); }
  .rail { position: relative; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); margin: 0 0 var(--s5); padding: 0; list-style: none; }
  .rail::before { content: ""; position: absolute; left: 6px; right: 6px; top: 19px; height: 1px; background: var(--line); }
  .rail button { position: relative; display: grid; justify-items: start; gap: var(--s1); width: 100%; min-height: 40px; padding: var(--s3) var(--s2) var(--s2) 0; border: 0; background: none; text-align: left; cursor: pointer; }
  .rail .node { width: 13px; height: 13px; border-radius: 50%; border: 1.5px solid #c9c9cf; background: #fff; }
  .rail .has .node { border-color: var(--ink-2); background: var(--ink-2); }
  .rail .you .node { border-color: var(--accent); background: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
  .rail .c { font: 300 26px/1 var(--sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; margin-top: var(--s2); }
  .rail .l { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; }
  .rail .you .l { color: var(--ink); font-weight: 500; }
  .rail button:hover .l { text-decoration: underline; }
  .board.books { scroll-padding-left: 0; mask-image: linear-gradient(90deg, #000 calc(100% - 40px), transparent); }
  .board.books.at-end { mask-image: none; }

  /* production: list view */
  .glist { display: grid; gap: var(--s6); }
  .glist .sec-head h2 { display: flex; align-items: center; gap: var(--s2); font-size: 17px; }
  .lrow { grid-template-columns: auto minmax(160px, 1fr) minmax(0, 1.6fr) auto; }
  .lrow .chips, .lrow .bar, .lrow .tries { margin-top: 0; }
  .lrow .bar { max-width: 260px; }
  .lrow .st { display: grid; gap: var(--s1); font-size: 13px; color: var(--ink-2); }
  .lrow .btn { width: auto; margin: 0; }
  .lrow .who-b { font-weight: 500; font-size: 14px; } .lrow .who-b small { display: block; font-weight: 400; font-size: 12.5px; color: var(--ink-3); }
  .nothing { font-size: 13px; color: var(--ink-3); }

  @media (max-width: 1100px) {
    .board { grid-auto-columns: 240px; }
    .lower { grid-template-columns: 1fr; gap: var(--s6); }
  }
  @media (max-width: 860px) {
    .jobs { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s2); margin-bottom: var(--s5); }
    .job { min-height: 104px; padding: var(--s3); }
    .job .v { font-size: 32px; }
    .job svg.spark { width: 52px; height: 22px; }
    .board, .rail { margin-left: calc(-1 * var(--s4)); margin-right: calc(-1 * var(--s4)); padding-left: var(--s4); padding-right: var(--s4); scroll-padding-left: var(--s4); }
    .board { grid-auto-columns: 85%; }
    .board.books { mask-image: none; }
    .rail { display: flex; overflow-x: auto; scrollbar-width: none; }
    .rail::before { left: var(--s4); right: auto; width: 640px; }
    .rail li { flex: 0 0 92px; }
    .fcard .btn, .q .btn, .lrow .btn { height: 40px; }
    .seg button { height: 40px; }
    .q { grid-template-columns: auto minmax(0, 1fr) auto; }
    .q .btn { grid-column: 1 / -1; justify-content: center; }
    .lrow { grid-template-columns: auto minmax(0, 1fr); }
    .lrow .st, .lrow > :last-child { grid-column: 1 / -1; }
    .lrow .btn { width: 100%; justify-content: center; }
  }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
(function () {
  let view = "board"; // Production page: "board" or "list"
  const BOOK_COLS = [{ key: "none", label: "No workbook yet" }];
  const EMPTY = {
    signed: "No new signups waiting", testing: "No one is taking the test", tested: "No reports waiting for a card",
    card: "No saved cards waiting", paying: "No customers yet",
    none: "Every customer child has a workbook", making: "Nothing is being made", review: "Nothing to review",
    approved: "Nothing waiting to print", printed: "Nothing waiting to ship", shipped: "Nothing on the way", delivered: "Nothing delivered yet",
  };
  const KIND = { signup: "var(--sky)", book: "var(--sun)", test: "var(--g3)", customer: "var(--leaf)", marking: "var(--accent)" };
  const NEEDS_YOU = ["none", "review"];
  const reduce = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

  const initials = (name) => name.split(/\s+/).map((w) => w[0]).slice(0, 2).join("").toUpperCase();
  const shortGrade = (g) => g === "Kindergarten" ? "K" : g.replace("Grade ", "Gr ");
  function inStage(s) {
    if (s.startsWith("Today, ")) return "since " + s.slice(7);
    if (s.startsWith("Yesterday")) return "since yesterday";
    const m = s.match(/^Nov (\d+)/);
    return m ? `${10 - Number(m[1])} days` : s;
  }
  function kidsLine(f) {
    const more = f.kidsMore ? ` and ${f.kidsMore} more` : "";
    if (f.kids.length === 1) return `${f.kids[0].name}, ${f.kids[0].grade}`;
    return f.kids.map((k) => `${k.name}, ${shortGrade(k.grade)}`).join(" · ") + more;
  }
  function spark(values, color) {
    const w = 76, h = 28, max = Math.max(...values, 1), step = w / (values.length - 1);
    const pts = values.map((v, i) => [i * step, h - (v / max) * (h - 4) - 2]);
    const line = pts.map((p) => p.map((n) => n.toFixed(1)).join(",")).join(" ");
    const [lx, ly] = pts[pts.length - 1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline points="0,${h} ${line} ${w},${h}" fill="${color}" opacity=".14" stroke="none"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${lx}" cy="${ly}" r="2.6" fill="${color}"/></svg>`;
  }

  // ---------- Home ----------
  function familyBooks(ctx, f) {
    const ids = f.kids.map((k) => k.id);
    return ctx.books.filter((b) => ids.includes(b.childId));
  }
  function familyAction(ctx, f) {
    const books = familyBooks(ctx, f);
    const none = books.filter((b) => b.state === "none");
    const review = books.find((b) => b.state === "review");
    if (review) return { label: `Review ${review.child}'s Book ${review.n}`, toast: `Opening ${review.child}'s Book ${review.n} draft` };
    if (none.length) return { label: none.length > 1 ? `Prepare ${none.length} workbooks` : "Prepare workbook", toast: `Preparing Book 1 for ${none.map((b) => b.child).join(" and ")}` };
    return null;
  }
  function familyCard(ctx, f) {
    const { esc } = ctx;
    const act = familyAction(ctx, f);
    const making = familyBooks(ctx, f).find((b) => b.state === "making");
    const jobs = [f.isNew && "customers", act && "books", ["signed", "testing", "tested"].includes(f.stage) && "signups"].filter(Boolean).join(" ");
    return `<li class="fcard${act ? " is-act" : ""}${f.test ? " is-test" : ""}" data-jobs="${jobs}">
      <div class="fc-top">
        <span class="avatar" style="background:${esc(f.color)}">${esc(initials(f.parent))}</span>
        <div class="fc-who"><a href="#/families">${esc(f.parent)}</a><div class="fc-kids">${esc(kidsLine(f))}</div></div>
      </div>
      <p class="fc-note">${esc(f.note)}</p>
      ${making ? `<div class="bar" title="Book ${making.n} for ${esc(making.child)}"><i><b style="width:${making.progress}%"></b></i><span>${making.progress}%</span></div>` : ""}
      <div class="fc-meta">
        <span class="since">${esc(inStage(f.stageAt))}</span>
        ${f.isNew ? `<span class="tag new">New</span>` : ""}
        ${f.live ? `<span class="tag live"><span class="pulse" aria-hidden="true"></span>Live now</span>` : ""}
        ${f.test ? `<span class="chip test">test</span>` : ""}
      </div>
      ${act ? `<button class="btn sm" type="button" data-toast="${esc(act.toast)}">${esc(act.label)}</button>` : ""}
    </li>`;
  }
  function column(ctx, stage, items, cardFn, headTag) {
    const real = items.filter((x) => !x.test).length, tests = items.length - real;
    return `<section class="col" id="col-${stage.key}" aria-label="${ctx.esc(stage.label)}, ${real}">
      <header class="col-head"><span class="tone ${stage.tone || ""}" aria-hidden="true"></span><${headTag}>${ctx.esc(stage.label)}</${headTag}>
        ${tests ? `<span class="plus">+${tests} test</span>` : ""}<span class="n num${real ? "" : " zero"}" aria-hidden="true">${real}</span></header>
      ${items.length ? `<ul>${items.map((x) => cardFn(ctx, x)).join("")}</ul>` : `<div class="empty">${ctx.esc(EMPTY[stage.key] || "Nothing here")}</div>`}
    </section>`;
  }

  function renderHome(ctx) {
    const { esc } = ctx;
    const real = (a) => a.filter((x) => !x.test);
    const books = real(ctx.books);
    const toReview = books.filter((b) => b.state === "review").length, toStart = books.filter((b) => b.state === "none").length;
    const marks = real(ctx.marking);
    const oldest = marks.reduce((m, x) => (x.sinceMin > (m?.sinceMin ?? -1) ? x : m), null);
    const kpi = (k) => ctx.KPIS.find((x) => x.key === k);
    const jobs = [
      { hl: "customers", label: "New customers", v: kpi("customers").value, s: "saved a card this week", c: "var(--leaf)", spark: ctx.SERIES.cards },
      { hl: "books", label: "Workbooks need you", v: toReview + toStart, s: [toReview && `${toReview} to review`, toStart && `${toStart} to start`].filter(Boolean).join(", ") || "All on track", c: "var(--sun)" },
      { hl: "signups", label: "New signups", v: kpi("signups").value, s: "this week", c: "var(--sky)", spark: ctx.SERIES.signups },
      { hl: "marking", label: "Answers to mark", v: marks.length, s: oldest ? `oldest waits ${oldest.since}` : "None waiting", c: "var(--accent)" },
    ];
    const stages = ctx.STAGES.filter((s) => s.key !== "waitlist");
    const wait = ctx.families.filter((f) => f.stage === "waitlist");
    const markedPct = Math.round((ctx.MARKED.pages / ctx.MARKED.of) * 100);
    return `${ctx.testbar}
    <header class="page-head"><div><span class="eyebrow">Tuesday, 10 November</span><h1>Home</h1><p>Every family on the way to a workbook, and what needs you today.</p></div></header>
    <h2 class="sr">Today's jobs</h2>
    <div class="jobs">${jobs.map((j) => `
      <button class="job" type="button" data-hl="${j.hl}" aria-pressed="false" style="--c:${j.c}">
        <span class="k">${esc(j.label)}</span><span class="vrow"><span class="v">${j.v}</span>${j.spark ? spark(j.spark, j.c) : ""}</span><span class="s">${esc(j.s)}</span>
      </button>`).join("")}
    </div>
    <div class="sec-head"><h2>Families by stage</h2><span class="focus-note" aria-live="polite"></span><a class="more" href="#/families">All families</a></div>
    <div class="board" id="fboard">${stages.map((s) => column(ctx, s, ctx.families.filter((f) => f.stage === s.key), familyCard, "h3")).join("")}</div>
    ${wait.length ? `<div class="lane" role="group" aria-label="Waitlist"><span class="k"><span class="tone" aria-hidden="true"></span>Waitlist · ${wait.length}</span>
      <ul>${wait.map((f) => `<li><span class="avatar" style="background:${esc(f.color)}">${esc(initials(f.parent))}</span><a href="#/delivery">${esc(f.parent)}</a><span class="faint">${esc(f.note.split(".")[0])}</span></li>`).join("")}</ul></div>` : ""}
    <div class="lower">
      <section id="queue" aria-labelledby="q-h">
        <div class="sec-head"><h2 id="q-h">Answers to mark</h2><span class="chip ${marks.length ? "bad" : "ok"} num">${marks.length} waiting</span><a class="more" href="#/marking">Open marking</a></div>
        <div class="qsum"><span>${esc(ctx.MARKED.child)}: ${ctx.MARKED.pages} of ${ctx.MARKED.of} pages marked</span><div class="bar"><i><b style="width:${markedPct}%"></b></i></div></div>
        ${ctx.marking.length ? `<ul class="rows">${ctx.marking.map((m) => {
          const f = ctx.family(m.family);
          const read = m.read === "Could not read" ? "Nothing read" : `AI read ${m.read}`;
          return `<li class="q"><span class="avatar" style="background:${esc(f?.color || "#eee")}">${esc(m.child[0])}</span>
            <div class="where">${esc(m.child)} · ${esc(m.book)} ${m.test ? `<span class="chip test">test</span>` : ""}<small>${esc(m.where)} · ${esc(m.reason)} · ${esc(m.since)} ago</small></div>
            <span class="read">${esc(read)}</span>
            <button class="btn ghost sm" type="button" data-toast="Opening ${esc(m.child)}'s answer">Check answer</button></li>`;
        }).join("")}</ul>` : `<div class="empty">No answers waiting. The AI marked everything.</div>`}
      </section>
      <section aria-labelledby="a-h">
        <div class="sec-head"><h2 id="a-h">Latest activity</h2></div>
        <ul class="rows">${ctx.ACTIVITY.map((a) => `<li class="act"><time>${esc(a.at)}</time><span class="dot" style="background:${KIND[a.kind] || "var(--ink-3)"}" aria-hidden="true"></span>
          <p><a href="#/families">${esc(a.who)}</a> ${esc(a.what)}<small>${esc(a.detail)}</small></p></li>`).join("")}</ul>
      </section>
    </div>`;
  }

  // ---------- Workbooks > Production ----------
  function checkChips(c) {
    if (!c) return "";
    const out = [];
    if (c.fix) out.push(`<span class="chip bad">${c.fix} to fix</span>`);
    if (c.fit) out.push(`<span class="chip warn">${c.fit} page${c.fit > 1 ? "s" : ""} do${c.fit > 1 ? "" : "es"} not fit</span>`);
    if (c.missing) out.push(`<span class="chip warn">${c.missing} question${c.missing > 1 ? "s" : ""} missing</span>`);
    if (c.byHand) out.push(`<span class="chip warn">${c.byHand} to check by hand</span>`);
    if (c.mathOk === c.mathAll) out.push(`<span class="chip ok">All math checks passed</span>`);
    return `<div class="chips">${out.join("")}</div>`;
  }
  function tries(ctx, b) {
    const h = b.history || [];
    if (!h.length) return "";
    return `<details class="tries"><summary>${h.length} earlier ${h.length > 1 ? "tries" : "try"}</summary><ol>${h.map((x) => `<li><b>${ctx.esc(x.what)}</b> · ${ctx.esc(x.when)}<br>${ctx.esc(x.why)}</li>`).join("")}</ol></details>`;
  }
  function bookAction(b) {
    if (b.state === "none") return { label: "Prepare workbook", toast: `Preparing Book ${b.n} for ${b.child}` };
    if (b.state === "review") return { label: "Review draft", toast: `Opening ${b.child}'s Book ${b.n} draft` };
    return null;
  }
  function bookStatus(ctx, b) {
    const { esc } = ctx;
    switch (b.state) {
      case "none": return `<p class="fc-note">${esc(b.detail)}</p>`;
      case "making": return `<div class="bar"><i><b style="width:${b.progress}%"></b></i><span>${b.progress}%</span></div><p class="fc-note">${esc(b.detail)} ${esc(b.eta)}.</p>`;
      case "review": return `${checkChips(b.checks)}<p class="fc-note">${esc(b.detail)} Made ${esc(b.made.replace(/^Yesterday/, "yesterday"))}.</p>`;
      case "shipped": return `<p class="fc-note"><b class="num">Shipped ${esc(b.done)}.</b> ${esc(b.detail)}</p>`;
      case "delivered": return `<p class="fc-note"><b class="num">${esc(b.detail.split(".")[0])}.</b>${esc(b.detail.split(".").slice(1).join("."))}</p>`;
      default: return `<p class="fc-note">${esc(b.detail || "")}</p>`;
    }
  }
  function bookWho(ctx, b) {
    const f = ctx.family(b.family);
    return { f, avatar: `<span class="avatar" style="background:${ctx.esc(f?.color || "#eee")}">${ctx.esc(b.child[0])}</span>` };
  }
  function bookCard(ctx, b) {
    const { esc } = ctx;
    const act = bookAction(b), { f, avatar } = bookWho(ctx, b);
    return `<li class="fcard${act ? " is-act" : ""}${b.test ? " is-test" : ""}">
      <div class="fc-top">${avatar}<div class="fc-who"><a href="#/families">${esc(b.child)}</a><div class="fc-kids">Book ${b.n} · ${esc(f?.parent || "")}</div></div>${b.test ? `<span class="chip test">test</span>` : ""}</div>
      ${bookStatus(ctx, b)}${tries(ctx, b)}
      ${act ? `<button class="btn sm" type="button" data-toast="${esc(act.toast)}">${esc(act.label)}</button>` : ""}
    </li>`;
  }
  function bookRow(ctx, b) {
    const { esc } = ctx;
    const act = bookAction(b), { f, avatar } = bookWho(ctx, b);
    return `<li class="lrow">${avatar}
      <div class="who-b">${esc(b.child)}, Book ${b.n} ${b.test ? `<span class="chip test">test</span>` : ""}<small>${esc(f?.parent || "")}</small></div>
      <div class="st">${bookStatus(ctx, b).replaceAll('class="fc-note"', 'class="fc-note" style="margin:0"')}${tries(ctx, b)}</div>
      <div>${act ? `<button class="btn sm" type="button" data-toast="${esc(act.toast)}">${esc(act.label)}</button>` : ""}</div>
    </li>`;
  }

  function renderWorkbooks(ctx) {
    const { esc } = ctx;
    const cols = [...BOOK_COLS, ...ctx.BOOK_STEPS].map((c) => ({ ...c, tone: NEEDS_YOU.includes(c.key) ? "act" : c.key === "delivered" ? "ok" : c.key === "making" ? "info" : "" }));
    const by = (k) => ctx.books.filter((b) => b.state === k);
    const realCount = (k) => by(k).filter((b) => !b.test).length;
    const needs = cols.filter((c) => NEEDS_YOU.includes(c.key)).reduce((n, c) => n + realCount(c.key), 0);
    const rail = `<ol class="rail" aria-label="Book stages">${cols.map((c) => {
      const n = realCount(c.key), you = NEEDS_YOU.includes(c.key) && n;
      return `<li class="${n ? "has" : ""}${you ? " you" : ""}"><button type="button" data-jump="col-${c.key}"><span class="node" aria-hidden="true"></span><span class="c">${n}</span><span class="l">${esc(c.label)}${you ? '<span class="sr"> (needs you)</span>' : ""}</span></button></li>`;
    }).join("")}</ol>`;
    let body;
    if (view === "board") {
      body = `<div class="board books" id="bboard">${cols.map((c) => column(ctx, c, by(c.key), bookCard, "h2")).join("")}</div>`;
    } else {
      const full = cols.filter((c) => by(c.key).length), empty = cols.filter((c) => !by(c.key).length);
      body = `<div class="glist">${full.map((c) => {
        const real = by(c.key).filter((b) => !b.test).length;
        return `<section id="col-${c.key}" aria-labelledby="h-${c.key}"><div class="sec-head"><h2 id="h-${c.key}"><span class="tone ${c.tone}" aria-hidden="true"></span>${esc(c.label)}</h2><span class="faint num">${real}</span></div>
          <ul class="rows">${by(c.key).map((b) => bookRow(ctx, b)).join("")}</ul></section>`;
      }).join("")}
      ${empty.length ? `<p class="nothing">Nothing in ${esc(empty.map((c) => c.label).join(", ").replace(/, ([^,]*)$/, " or $1"))} right now.</p>` : ""}</div>`;
    }
    return `${ctx.testbar}
    <header class="page-head"><div><span class="eyebrow">Workbooks</span><h1>Production</h1><p>Every workbook from first draft to the family's door. ${needs ? `${needs} need${needs > 1 ? "" : "s"} you now.` : "Nothing needs you now."}</p></div>
      <div class="actions"><div class="seg" role="group" aria-label="View"><button type="button" data-view="board" aria-pressed="${view === "board"}">Board</button><button type="button" data-view="list" aria-pressed="${view === "list"}">List</button></div></div></header>
    ${rail}${body}`;
  }

  // ---------- behaviour ----------
  function after(main) {
    const smooth = reduce() ? "auto" : "smooth";
    const board = main.querySelector("#bboard");
    if (board) {
      const edge = () => board.classList.toggle("at-end", board.scrollLeft + board.clientWidth >= board.scrollWidth - 4);
      board.onscroll = edge; edge();
    }
    main.onclick = (e) => {
      const v = e.target.closest("[data-view]");
      if (v) { view = v.dataset.view; window.ADMIN.render(); return; }
      const j = e.target.closest("[data-jump]");
      if (j) {
        const col = main.querySelector("#" + j.dataset.jump);
        if (!col) return;
        col.scrollIntoView({ behavior: smooth, block: "nearest", inline: "start" });
        col.classList.remove("flash"); void col.offsetWidth; col.classList.add("flash");
        return;
      }
      const clear = e.target.closest("[data-clear]");
      const h = clear ? main.querySelector('.job[aria-pressed="true"]') : e.target.closest("[data-hl]");
      if (!h) return;
      const key = h.dataset.hl, on = !clear && h.getAttribute("aria-pressed") !== "true";
      main.querySelectorAll("[data-hl]").forEach((b) => b.setAttribute("aria-pressed", "false"));
      const fboard = main.querySelector("#fboard"), note = main.querySelector(".focus-note");
      fboard.classList.remove("is-focus");
      fboard.querySelectorAll(".is-hl").forEach((c) => c.classList.remove("is-hl"));
      note.innerHTML = "";
      if (!on) return;
      h.setAttribute("aria-pressed", "true");
      if (key === "marking") {
        const q = main.querySelector("#queue");
        q.scrollIntoView({ behavior: smooth, block: "start" });
        q.classList.remove("flash"); void q.offsetWidth; q.classList.add("flash");
        h.setAttribute("aria-pressed", "false");
        return;
      }
      const hits = [...fboard.querySelectorAll(".fcard")].filter((c) => c.dataset.jobs.split(" ").includes(key));
      fboard.classList.add("is-focus");
      hits.forEach((c) => c.classList.add("is-hl"));
      const label = h.querySelector(".k").textContent.toLowerCase();
      note.innerHTML = `${hits.length} ${hits.length === 1 ? "family" : "families"}: ${window.ADMIN.esc(label)}.<button type="button" data-clear>Show all</button>`;
      if (hits[0]) hits[0].scrollIntoView({ behavior: smooth, block: "nearest", inline: "nearest" });
    };
  }

  window.OPTION = { renderHome, renderWorkbooks, after };
})();
</script>
</body>
</html>
