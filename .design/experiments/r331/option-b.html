<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>r331 B · One notes feed with a side panel</title><link rel="stylesheet" href="shared.css"><script src="data.js"></script>
<style>
.feed { margin-top: 40px; }
.feed-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
.tabs { display: flex; gap: 6px; }
.tabs button { font: 500 14px var(--sans); border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 14px; }
.tabs button.on { background: var(--accent-soft); border-color: var(--accent); }
.row { display: grid; grid-template-columns: 120px 1fr auto; gap: 8px 20px; padding: 18px 20px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; align-items: start; background: #fff; }
.row.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.row .day { font-weight: 500; }
.row .open { font-weight: 500; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
.row .first { font-size: 16px; margin: 0; }
.kid { font: 500 12px var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.scrim { position: fixed; inset: 0; background: rgba(12,12,14,.28); }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 560px; background: #fff; box-shadow: -10px 0 40px rgba(0,0,0,.12); overflow: auto; padding: 28px 32px 40px; }
.drawer .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.drawer .x { border: 1px solid var(--line); border-radius: 6px; background: #fff; padding: 8px 12px; font: 500 15px var(--sans); }
.drawer .notebox { background: var(--soft); border-radius: 10px; padding: 16px 18px; margin: 14px 0 24px; }
@media (max-width: 700px) {
  .row { grid-template-columns: 1fr; padding: 16px; }
  .drawer { width: 100%; padding: 18px 18px 40px; }
}
</style></head><body>
<header class="nav"><span class="brand">Unica Learning</span><a href="#">Back to home</a></header>
<main>
  <div class="kicker">Your account</div>
  <h1>Hi, Priya.</h1>
  <div class="child" style="margin-bottom:12px"><div class="child-top"><div><h2>Leah</h2><div class="muted small">Grade 3 · Workbook 2</div></div><a class="btn dark" href="#">Open the desk →</a></div></div>
  <div class="child"><div class="child-top"><div><h2>Sam</h2><div class="muted small">Grade 1 · Workbook 1</div></div><a class="btn dark" href="#">Open the desk →</a></div></div>
  <section class="feed">
    <div class="feed-head"><div><h2>Notes from Maya</h2><div class="muted small">After each call, newest first.</div></div>
      <div class="tabs"><button class="on">All</button><button>Leah</button><button>Sam</button></div></div>
    <div id="rows"></div>
  </section>
</main>
<div id="panel"></div>
<script>
const order = ["c3", "s1", "c2", "c1"];
const calls = order.map((id) => CALLS.find((c) => c.id === id));
const showCall = location.hash === "#call";
document.getElementById("rows").innerHTML = calls.map((c) => `
  <article class="row ${showCall && c.id === "c3" ? "sel" : ""}">
    <div><div class="day">${c.whenShort}</div><div class="kid">${c.child}</div></div>
    <div><div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:6px"><span class="chip ${c.finished}">${c.chip}</span><span class="small muted">Page ${c.page}, question ${c.number} · ${c.minutes} min</span></div>
      <p class="first">${c.sentences[1]}</p></div>
    <a class="open" href="#call">Read the note and call</a>
  </article>`).join("");
if (showCall) {
  const c = calls[0];
  document.getElementById("panel").innerHTML = `<div class="scrim"></div><aside class="drawer" role="dialog" aria-label="Call with Maya">
    <div class="bar"><span class="tiny">${c.when.toUpperCase()}</span><button class="x">Close</button></div>
    <h2>Leah · page ${c.page}, question ${c.number}</h2>
    <div style="margin-top:8px;display:flex;gap:10px;align-items:center"><span class="chip ${c.finished}">${c.chip}</span><span class="q">${c.question}</span><span class="small muted">${c.minutes} min</span></div>
    <div class="notebox">${noteHtml(c)}</div>
    <h3 style="margin-bottom:14px">What Leah and Maya said</h3>${txHtml()}
    <p class="footnote">Maya is an AI teaching assistant. We keep the words of the call, never a recording.</p></aside>`;
}
</script></body></html>
