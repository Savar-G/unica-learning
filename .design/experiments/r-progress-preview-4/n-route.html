<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>N. Prediction and route</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono&family=Gochi+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
.hero { padding: clamp(28px, 5vw, 56px) 0 clamp(24px, 4vw, 40px); border-bottom: 1px solid var(--line); }
.say { max-width: 15em; margin-top: 14px; font-size: clamp(34px, 5.4vw, 64px); font-weight: 300; line-height: 1.04; letter-spacing: -.04em; }
.say mark { padding: 0 .1em; background: linear-gradient(transparent 12%, #ffd23f 12%, #ffd23f 88%, transparent 88%); color: inherit; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.today { margin-top: 18px; font-size: 18px; color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 28px; border-top: 1px solid var(--ink); }
@media (max-width: 760px) { .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.facts div { padding: 14px 16px 0 0; }
.facts b { display: block; font-size: clamp(26px, 3vw, 36px); font-weight: 400; letter-spacing: -.03em; line-height: 1.1; }
.facts span { font: 400 12px/1.3 var(--mono); color: var(--ink-2); }
.how { margin-top: clamp(28px, 4vw, 44px); }
.how h3 { margin: 0; font-size: 24px; font-weight: 400; letter-spacing: -.02em; }
.track { display: flex; align-items: center; gap: 0; margin-top: 22px; }
.track .seg { height: 10px; flex: var(--w) 1 0; background: var(--c); }
.track .seg:first-of-type { border-radius: 99px 0 0 99px; }
.track .dot { width: 18px; height: 18px; flex: none; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 3px var(--ink); }
.track .flag { flex: none; width: 34px; height: 34px; margin-left: -2px; }
.stages { display: grid; grid-template-columns: var(--cols); gap: 0; margin-top: 16px; }
@media (max-width: 760px) { .track { display: none; } .stages { grid-template-columns: 1fr !important; gap: 0; } }
.st { padding: 4px 22px 4px 0; }
@media (max-width: 760px) { .st { padding: 16px 0 16px 16px; border-left: 4px solid var(--c); margin-bottom: 8px; } }
.st .when { font: 500 12px/1.3 var(--mono); letter-spacing: .04em; text-transform: uppercase; color: var(--ink-2); }
.st h4 { margin: 6px 0 0; font-size: 22px; font-weight: 500; letter-spacing: -.02em; }
.st ul { margin: 10px 0 0; padding: 0; list-style: none; }
.st li { padding: 3px 0; color: var(--ink-2); }
.st .ex { margin-top: 12px; font: 400 26px/1 "Gochi Hand", cursive; color: #1d3a8a; white-space: nowrap; }
.st .ex b { font-weight: 400; color: #c2410c; }
.st.goal h4 { font-weight: 600; }
.st.goal .pill { display: inline-block; margin-top: 10px; padding: 6px 10px; border-radius: 99px; background: var(--ink); color: #fff; font: 500 12px/1 var(--mono); }
</style>
</head>
<body>
<div class="chrome"><span class="v">N. Prediction and route</span><div class="cases" data-cases></div><a href="board.html">All options</a></div>
<main class="page">
  <div class="stub">Report: "Where Leah is", "What's in workbook 1" (unchanged)</div>
  <section class="section" id="out"></section>
  <div class="stub">Next step: card and plan button (unchanged)</div>
</main>
<script src="levels.js"></script><script src="covers.js"></script><script src="plan.js"></script>
<script>
// The outcome in one sentence, the plan in four numbers, then the route: one column per grade, sized by time.
mount((p) => {
  const n = p.c.name;
  const total = p.goalDate - p.stages[0].from;
  const segs = p.stages.map((s) => `<i class="seg" style="--w:${((s.to - s.from) / total * 100).toFixed(1)};--c:${gradeColor(s.grade)}"></i>`).join("");
  const flag = `<svg class="flag" viewBox="0 0 34 34" aria-hidden="true"><path d="M6 32V3" stroke="#0c0c0e" stroke-width="3" stroke-linecap="round"/><path d="M7 4h22l-6 7 6 7H7z" fill="#ff6430"/></svg>`;
  const cols = p.stages.map((s) => `${((s.to - s.from) / total * 100).toFixed(1)}fr`).join(" ") + " minmax(240px, .6fr)";
  const stages = p.stages.map((s) => `<div class="st" style="--c:${gradeColor(s.grade)}">
      <p class="when">${monthShort(s.from)} ${s.from.getFullYear()} to ${monthShort(s.to)} ${s.to.getFullYear()}</p>
      <h4>${gradeName(s.grade)} math</h4>
      <ul>${s.levels.map((l) => `<li>${l.title}</li>`).join("")}</ul>
      <p class="ex">${EX[s.grade][0]}<b>${EX[s.grade][1]}</b></p>
    </div>`).join("") + `<div class="st goal"><p class="when">By ${monthShort(p.goalDate)} ${p.goalDate.getFullYear()}</p><h4>${gradeName(p.goal)} level</h4>
      <p class="ex">${EX[p.goal][0]}<b>${EX[p.goal][1]}</b></p><span class="pill">The goal</span></div>`;
  document.getElementById("out").innerHTML = `
    <div class="hero">
      <p class="k">Our prediction for ${n}</p>
      <p class="say">We predict ${n} can reach a ${gradeName(p.goal)} level by <mark>${monthYear(p.goalDate)}</mark>.</p>
      <p class="today">${n} works at a ${gradeName(p.c.working)} level today. This is the plan that gets ${n} there.</p>
      <div class="facts">
        <div><b>5 days</b><span>a week</span></div>
        <div><b>${p.day.pages} pages</b><span>a day, ${p.day.min} minutes</span></div>
        <div><b>${p.books.length} workbooks</b><span>a new one every 2 weeks</span></div>
        <div><b>${p.stages.length} grades</b><span>of the BC curriculum</span></div>
      </div>
    </div>
    <div class="how">
      <h3>How ${n} gets there</h3>
      <div class="track"><i class="dot"></i>${segs}${flag}</div>
      <div class="stages" style="--cols:${cols}">${stages}</div>
      <p class="basis">${basis(p)}</p>
    </div>`;
});
</script>
</body>
</html>
