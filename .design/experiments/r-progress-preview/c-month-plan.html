<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>C. Month by month</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
.mp { display: grid; grid-template-columns: minmax(220px, 1fr) 2fr; gap: 24px clamp(24px, 5vw, 64px); margin-top: 24px; }
@media (max-width: 760px) { .mp { grid-template-columns: 1fr; } }
.mp-side { position: sticky; top: 72px; align-self: start; padding: 24px; }
.mp-side .big { margin-top: 8px; font-size: 44px; font-weight: 300; line-height: 1; letter-spacing: -0.03em; }
.mp-side .big small { display: block; margin-top: 6px; font: 400 13px/1.3 var(--mono); color: var(--ink-2); letter-spacing: 0; }
.mp-side .pace { margin-top: 18px; }
.months { margin: 0; padding: 0; list-style: none; }
.month { display: grid; grid-template-columns: 96px 1fr; gap: 16px; padding: 14px 0; border-top: 1px solid var(--line); }
.month .m { font: 400 13px/1.4 var(--mono); color: var(--ink-2); }
.month .m b { display: block; font-weight: 600; color: var(--ink); }
.month .t b { display: block; font-weight: 500; }
.month .t span { font: 400 12px/1.3 var(--mono); color: var(--ink-3); }
.mile { display: flex; align-items: center; gap: 10px; margin: 6px 0; padding: 12px 16px; border-radius: 10px; background: color-mix(in srgb, var(--leaf) 16%, #fff); font-weight: 500; }
.mile::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--leaf); }
.mile.is-goal { background: var(--ink); color: #fff; }
.mile.is-goal::before { content: "⚑"; width: auto; height: auto; background: none; font-size: 16px; line-height: 1; }
.more { margin-top: 10px; min-height: 44px; padding: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: #fff; cursor: pointer; }
.months.is-short .month.is-late, .months.is-short .mile.is-late { display: none; }
</style>
</head>
<body>
<div class="chrome"><span class="v">C. Month by month</span><div class="cases" data-cases></div><a href="board.html">All options</a></div>
<main class="page">
  <div class="stub">Report: "Where Leah is", "What's in workbook 1" (unchanged)</div>
  <section class="section" id="out"></section>
  <div class="stub">Next step: card and plan button (unchanged)</div>
</main>
<script src="levels.js"></script><script src="pace.js"></script>
<script>
let open = false;
mount((p, setPace) => {
  // Group books by the month they start.
  const groups = [];
  for (const b of p.books) {
    const key = monthYear(b.start);
    const g = groups.at(-1);
    if (g && g.key === key) g.books.push(b); else groups.push({ key, date: b.start, books: [b] });
  }
  const rows = [];
  let lastGrade = null;
  groups.forEach((g, i) => {
    const late = i >= 4;
    for (const b of g.books) if (b.grade !== lastGrade) {
      if (lastGrade !== null) rows.push(`<li class="mile ${late ? "is-late" : ""}">${p.c.name} starts ${gradeName(b.grade)} work</li>`);
      lastGrade = b.grade;
    }
    const nums = g.books.length > 1 ? `Books ${g.books[0].n} and ${g.books.at(-1).n}` : `Book ${g.books[0].n}`;
    const titles = [...new Set(g.books.map((b) => b.title))];
    const test = g.books.some((b) => b.test) ? " · level test" : "";
    rows.push(`<li class="month ${late ? "is-late" : ""}"><div class="m"><b>${monthShort(g.date)}</b>${g.date.getFullYear()}</div><div class="t"><b>${titles.join("; ")}</b><span>${nums} · ${gradeName(g.books[0].grade)} work${test}</span></div></li>`);
  });
  rows.push(`<li class="mile is-goal">About ${monthYear(p.goalDate)}: ${p.c.name} reaches a ${gradeName(p.goal)} level</li>`);
  const out = document.getElementById("out");
  out.innerHTML = `
    <div class="section-head"><p class="k">Where ${p.c.name} can go</p><h2>${headline(p)}</h2></div>
    <div class="mp">
      <aside class="mp-side field"><p class="k">Goal</p><p class="big">${gradeName(p.goal)}<small>about ${monthYear(p.goalDate)} · ${p.books.length} books</small></p>${paceSwitch(p)}<p class="basis">${basis(p)}</p></aside>
      <div><ol class="months ${open ? "" : "is-short"}">${rows.join("")}</ol>
      ${groups.length > 4 ? `<button type="button" class="more" data-more>${open ? "Show less" : `Show all ${groups.length} months`}</button>` : ""}</div>
    </div>`;
  wirePace(out, setPace);
  out.querySelector("[data-more]")?.addEventListener("click", () => { open = !open; setPace(p.daysPerWeek); });
});
</script>
</body>
</html>
