<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>A. Book path</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
.path { margin-top: 24px; padding: clamp(20px, 3.5vw, 40px); }
.path-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.path-top .k { color: var(--ink); }
.track { display: flex; gap: 6px; margin-top: 28px; padding: 28px 18px 18px; border-radius: 12px; background: #fff; box-shadow: 0 20px 40px -24px rgba(0,0,0,.35); overflow-x: auto; }
.seg { flex: var(--n) 0 auto; min-width: calc(var(--n) * 22px + 8px); }
.seg + .seg { border-left: 1px dashed #d4d4da; padding-left: 8px; }
.seg-h { display: flex; justify-content: space-between; gap: 8px; font: 500 14px/1.2 var(--sans); white-space: nowrap; }
.seg-h small { font: 400 12px/1.2 var(--mono); color: var(--ink-2); }
.books { display: flex; gap: 4px; margin-top: 10px; }
.book { position: relative; flex: 1 1 0; min-width: 16px; height: 46px; border-radius: 4px 6px 6px 4px; background: color-mix(in srgb, var(--c) 30%, #fff); box-shadow: inset 3px 0 0 color-mix(in srgb, var(--c) 70%, #000 0%); }
.book.is-first { background: var(--c); }
.book.is-test::after { content: "✓"; position: absolute; inset: auto 0 4px; text-align: center; font: 600 11px/1 var(--mono); color: color-mix(in srgb, var(--c) 60%, #000); }
.seg-m { margin-top: 8px; font: 400 12px/1.3 var(--mono); color: var(--ink-2); white-space: nowrap; }
.goal { flex: 0 0 auto; display: grid; align-content: start; justify-items: center; gap: 6px; padding-left: 12px; border-left: 2px solid var(--ink); }
.goal svg { width: 34px; height: 46px; margin-top: 24px; }
.goal b { font: 600 12px/1.2 var(--mono); white-space: nowrap; }
.today { position: relative; }
.today::before { content: "Today"; position: absolute; top: -22px; left: 0; font: 600 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .06em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 12px; font: 400 13px/1.3 var(--mono); color: var(--ink); }
.legend i { display: inline-block; width: 12px; height: 16px; margin-right: 6px; vertical-align: -3px; border-radius: 2px 3px 3px 2px; background: color-mix(in srgb, var(--tang) 30%, #fff); }
.legend i.f { background: var(--tang); }
.topics { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; margin-top: 20px; }
.topic { padding: 16px 18px; border-radius: 12px; background: rgba(255,255,255,.72); }
.topic h3 { margin: 0; font: 500 17px/1.3 var(--sans); }
.topic .when { margin-top: 2px; font: 400 12px/1.3 var(--mono); color: var(--ink-2); }
.topic ul { margin: 10px 0 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.45; }
.topic li + li { margin-top: 4px; }
.topic li span { color: var(--ink-3); font: 400 12px/1 var(--mono); }
.topic.is-goal { background: var(--ink); color: #fff; }
.topic.is-goal .when, .topic.is-goal li { color: #d6d6dc; }
</style>
</head>
<body>
<div class="chrome"><span class="v">A. Book path</span><div class="cases" data-cases></div><a href="board.html">All options</a></div>
<main class="page">
  <div class="stub">Report: "Where Leah is", "What's in workbook 1" (unchanged)</div>
  <section class="section" id="out"></section>
  <div class="stub">Next step: card and plan button (unchanged)</div>
</main>
<script src="levels.js"></script><script src="pace.js"></script>
<script>
const COLORS = ["var(--tang)", "var(--sun)", "var(--leaf)", "var(--sky)"];
mount((p, setPace) => {
  const color = (g) => COLORS[(g - p.c.working) % COLORS.length];
  const range = (s) => s.books.length ? `${monthShort(s.books[0].start)} to ${monthShort(s.books.at(-1).start)}` : "";
  const segs = p.grades.filter((s) => s.books.length).map((s, i) => `
    <div class="seg ${i === 0 ? "today" : ""}" style="--n:${s.books.length};--c:${color(s.grade)}">
      <div class="seg-h">${gradeName(s.grade)} work <small>${s.books.length} books</small></div>
      <div class="books">${s.books.map((b) => `<span class="book ${b.n === 1 ? "is-first" : ""} ${b.test ? "is-test" : ""}" title="Book ${b.n}: ${b.title}"></span>`).join("")}</div>
      <div class="seg-m">${range(s)}</div>
    </div>`).join("");
  const topics = p.grades.map((s) => s.books.length ? `
    <div class="topic"><h3>${gradeName(s.grade)} work</h3><p class="when">Books ${s.books[0].n} to ${s.books.at(-1).n} · from ${monthYear(s.date)}</p>
      <ul>${s.levels.map((l) => `<li>${l.title}</li>`).join("")}</ul></div>`
    : `<div class="topic is-goal"><h3>${gradeName(s.grade)} level</h3><p class="when">about ${monthYear(s.date)}</p>
      <ul><li>${p.c.name} starts ${gradeName(s.grade)} work.</li></ul></div>`).join("");
  const out = document.getElementById("out");
  out.innerHTML = `
    <div class="section-head"><p class="k">Where ${p.c.name} can go</p><h2>${headline(p)}</h2></div>
    <div class="path field">
      <div class="path-top"><p class="k">${p.books.length} books to ${gradeName(p.goal)}</p>${paceSwitch(p)}</div>
      <div class="track">${segs}
        <div class="goal"><svg viewBox="0 0 34 46" aria-hidden="true"><path d="M5 44V4" stroke="#0c0c0e" stroke-width="2.5" stroke-linecap="round"/><path d="M6 5h22l-6 7 6 7H6z" fill="#0c0c0e"/></svg><b>${gradeName(p.goal)}</b><span class="seg-m">${monthShort(p.goalDate)} ${p.goalDate.getFullYear()}</span></div>
      </div>
      <p class="legend"><span><i class="f"></i>Book 1, made from this report</span><span><i></i>Next books, made from ${p.c.name}'s marked pages</span><span>✓ Level test book</span></p>
      <div class="topics">${topics}</div>
      <p class="basis">${basis(p)}</p>
    </div>`;
  wirePace(out, setPace);
});
</script>
</body>
</html>
