<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>D. Three stops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shell.css">
<style>
.ts { margin-top: 24px; padding: clamp(24px, 4vw, 48px); }
.ts-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; }
.stops { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 16px; margin-top: 36px; }
.stops::before { content: ""; position: absolute; top: 15px; left: 15px; right: calc(100% / var(--n) - 15px); height: 4px; border-radius: 2px; background: var(--ink); }
.stop { position: relative; }
.dot { position: relative; width: 34px; height: 34px; border-radius: 50%; background: #fff; border: 3px solid var(--ink); }
.stop.is-now .dot { background: var(--leaf); border-color: var(--leaf); }
.stop.is-goal .dot { display: grid; place-items: center; background: var(--ink); color: #fff; font-size: 16px; }
.stop .when { margin-top: 14px; font: 400 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); }
.stop h3 { margin: 4px 0 0; font-size: clamp(22px, 2.4vw, 30px); font-weight: 300; line-height: 1.1; letter-spacing: -0.03em; }
.stop ul { margin: 10px 0 0; padding: 0; list-style: none; font-size: 15px; line-height: 1.45; color: var(--ink); }
.stop li + li { margin-top: 4px; }
@media (max-width: 700px) {
  .stops { grid-template-columns: 1fr; gap: 22px; padding-left: 50px; }
  .stops::before { top: 15px; bottom: 15px; left: 15px; right: auto; width: 4px; height: auto; }
  .dot { position: absolute; left: -50px; top: 0; }
  .stop .when { margin-top: 6px; }
}
</style>
</head>
<body>
<div class="chrome"><span class="v">D. Three stops</span><div class="cases" data-cases></div><a href="board.html">All options</a></div>
<main class="page">
  <div class="stub">Report: "Where Leah is", "What's in workbook 1" (unchanged)</div>
  <section class="section" id="out"></section>
  <div class="stub">Next step: card and plan button (unchanged)</div>
</main>
<script src="levels.js"></script><script src="pace.js"></script>
<script>
mount((p, setPace) => {
  // Now, each grade on the way, the goal. With two grades to climb, that is three stops.
  const stops = p.grades.map((s, i) => {
    if (i === 0) return `<div class="stop is-now"><div class="dot"></div><p class="when">Book 1 · ${monthShort(s.date)} ${s.date.getFullYear()}</p><h3>${gradeName(s.grade)} work</h3><ul>${s.levels.slice(0, 3).map((l) => `<li>${l.title}</li>`).join("")}</ul></div>`;
    if (i === p.grades.length - 1) return `<div class="stop is-goal"><div class="dot" aria-hidden="true">⚑</div><p class="when">About ${monthShort(s.date)} ${s.date.getFullYear()}</p><h3>${gradeName(s.grade)} level</h3><ul><li>The goal: ${p.c.name} is ready for ${gradeName(s.grade)} work.</li></ul></div>`;
    return `<div class="stop"><div class="dot"></div><p class="when">Book ${s.firstBook} · ${monthShort(s.date)} ${s.date.getFullYear()}</p><h3>${gradeName(s.grade)} work</h3><ul>${s.levels.slice(0, 3).map((l) => `<li>${l.title}</li>`).join("")}</ul></div>`;
  }).join("");
  const out = document.getElementById("out");
  out.innerHTML = `
    <div class="section-head"><p class="k">Where ${p.c.name} can go</p><h2>${headline(p)}</h2></div>
    <div class="ts field">
      <div class="ts-top"><p class="k">${p.months} months · ${p.books.length} books</p>${paceSwitch(p)}</div>
      <div class="stops" style="--n:${p.grades.length}">${stops}</div>
      <p class="basis">${basis(p)}</p>
    </div>`;
  wirePace(out, setPace);
});
</script>
</body>
</html>
