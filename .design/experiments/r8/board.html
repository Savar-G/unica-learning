<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;font-family:var(--font-sans)}
.row{display:flex;gap:16px;overflow-x:auto;padding:4px 0 12px}
.opt{margin:0;flex:0 0 320px;display:flex;flex-direction:column;gap:10px}
figcaption b{font-size:15px} figcaption p{margin:4px 0;font-size:13px;color:var(--muted-foreground);line-height:1.4;min-height:54px}
.tag{margin-left:8px;font-size:11px;padding:2px 6px;border-radius:999px;background:var(--accent-surface);color:var(--accent-surface-foreground)}
.nums{display:flex;gap:14px;font-size:12px;font-family:var(--font-mono)} .nums em{font-style:normal;font-weight:700;font-size:15px}
.trade{min-height:36px!important}
.phone{border:1px solid var(--border);border-radius:calc(var(--radius) * 2);padding:8px;background:var(--card)}
.rec .phone{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.scroll{height:620px;overflow-y:auto;border-radius:var(--radius);background:#fff}
.pg{position:relative} .pg img{display:block;width:320px}
.price{position:absolute;left:0;right:0;border-top:2px dashed #e5484d} .price span{position:absolute;right:4px;top:-20px;font:600 11px var(--font-mono);background:#e5484d;color:#fff;padding:2px 6px;border-radius:4px}
.note{font-size:12px;color:var(--muted-foreground);margin:4px 0 0}
</style></head><body><div class="row"><figure class="opt">
