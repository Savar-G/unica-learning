name: IndexNow

# D-319: sends the sitemap pages that changed in the last 2 days to IndexNow (Bing and others), once a day
# (scripts/indexnow.mjs). Run it by hand with mode "all" once, for the first submission.
on:
  schedule:
    - cron: '20 16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Send recently changed pages, or every sitemap page
        type: choice
        options: [recent, all]
        default: recent
        required: true

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  indexnow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 1
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - run: node scripts/indexnow.mjs ${{ github.event.inputs.mode == 'all' && '--all' || '' }}
        timeout-minutes: 3
