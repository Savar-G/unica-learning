name: Blog publish

# The weekly blog routine (docs/blog-automation.md) pushes one post on a claude/blog-<slug> branch.
# validate: runs with read-only access (post code runs here, so it gets no write token). It runs main's guard,
#   merges into main locally, and verifies blog contract tests, lint, types, and next build (~3-4 min).
# publish: runs no post code. It loads main's publish script and guard, merges onto the latest origin/main,
#   dispatches full CI (ci.yml, read-only) on that exact merge commit on a temporary site/blog-publish-* branch,
#   and pushes main once CI passes. If main moves while CI runs, it re-merges and retries automatically.
#   A branch ending in -dryrun stops after validate.

on:
  push:
    branches: ['claude/blog-**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ startsWith(github.ref_name, 'claude/blog-') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check if already published
        id: merged
        run: |
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "already_merged=true" >> "$GITHUB_OUTPUT"
            echo "$BRANCH ($GITHUB_SHA) is already merged into origin/main; skipping validation."
          else
            echo "already_merged=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Only blog files changed
        if: ${{ steps.merged.outputs.already_merged != 'true' }}
        # Runs main's copy of the guard, so a branch cannot loosen the guard it is checked by.
        run: |
          git show origin/main:scripts/blog-publish-guard.mjs > "$RUNNER_TEMP/blog-publish-guard.mjs"
          node "$RUNNER_TEMP/blog-publish-guard.mjs" origin/main "$GITHUB_SHA"
      - name: Merge into main
        if: ${{ steps.merged.outputs.already_merged != 'true' }}
        run: |
          git config user.name "unica-blog-bot"
          git config user.email "unica-blog-bot@users.noreply.github.com"
          git checkout -B publish origin/main
          git merge --no-ff --no-edit -m "Blog: publish $BRANCH" "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: ${{ steps.merged.outputs.already_merged != 'true' }}
        timeout-minutes: 2
        with:
          node-version: '22.23.1'
          cache: npm
      - if: ${{ steps.merged.outputs.already_merged != 'true' }}
        run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Architectural guardrails
        if: ${{ steps.merged.outputs.already_merged != 'true' }}
        run: npm run check:guard
        timeout-minutes: 1
      - name: Blog contract tests
        if: ${{ steps.merged.outputs.already_merged != 'true' }}
        run: npm test -- src/lib/blog.test.ts src/lib/site-hits.test.ts
        timeout-minutes: 3
      - name: Lint blog changes
        if: ${{ steps.merged.outputs.already_merged != 'true' }}
        run: |
          npm run lint:fast
          npx eslint src/lib/blog.ts src/content/blog
        timeout-minutes: 3
      - name: App type check
        if: ${{ steps.merged.outputs.already_merged != 'true' }}
        run: npm run typecheck
        timeout-minutes: 4
      - name: Production build
        if: ${{ steps.merged.outputs.already_merged != 'true' }}
        run: npm run build
        timeout-minutes: 10

  publish:
    needs: [validate]
    if: ${{ startsWith(github.ref_name, 'claude/blog-') && !endsWith(github.ref_name, '-dryrun') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.ref_name }}
      HEAD_SHA: ${{ github.sha }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 2
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Test the exact merge and publish it
        # Loads main's publish script so untrusted blog branches cannot modify publish logic.
        run: |
          git show origin/main:.github/scripts/blog-publish.mjs > "$RUNNER_TEMP/blog-publish.mjs"
          node "$RUNNER_TEMP/blog-publish.mjs"
      - name: Clean up temporary branches
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/blog-publish.mjs" ] && [ -f "$RUNNER_TEMP/blog-publish-temp-branches.txt" ]; then
            node "$RUNNER_TEMP/blog-publish.mjs" --cleanup-only
          fi
