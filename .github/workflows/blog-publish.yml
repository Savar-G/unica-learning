name: Blog publish

# The weekly blog routine (docs/blog-automation.md) pushes one post on a claude/blog-<slug> branch.
# validate: checks that the branch only adds or fixes a post, merges it into main and runs the done gate,
#   with read-only access (post code runs here, so it gets no write token).
# publish: runs no post code. It confirms main has not moved, checks the guard again, makes the same merge
#   and pushes main (Vercel then deploys production). A branch whose name ends in -dryrun stops after validate.

on:
  push:
    branches: ['claude/blog-**']

permissions:
  contents: read

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      main_sha: ${{ steps.pin.outputs.main_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: pin
        run: echo "main_sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    # Above the sum of its step limits (checkout 2, setup 1, npm ci 5, Chromium 2, tests 35, eslint 5, build 10).
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 1
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Only blog files changed
        # Runs main's copy of the guard, so a branch cannot loosen the guard it is checked by.
        run: |
          git show ${{ needs.prepare.outputs.main_sha }}:scripts/blog-publish-guard.mjs > "$RUNNER_TEMP/blog-publish-guard.mjs"
          node "$RUNNER_TEMP/blog-publish-guard.mjs" ${{ needs.prepare.outputs.main_sha }} "$GITHUB_SHA"
      - name: Merge into main
        id: merge
        run: |
          git config user.name "unica-blog-bot"
          git config user.email "unica-blog-bot@users.noreply.github.com"
          git checkout -B publish ${{ needs.prepare.outputs.main_sha }}
          git merge --no-ff --no-edit -m "Blog: publish $BRANCH" "$GITHUB_SHA"
      - run: npm ci
        timeout-minutes: 5
      # Unpack @sparticuz/chromium to /tmp/chromium once, before the tests. Otherwise two Chromium test files unpack it at
      # the same time in parallel workers, and one starts Chromium while the other still writes it (spawn ETXTBSY).
      - name: Unpack Chromium
        run: node -e 'import("@sparticuz/chromium").then(async (m) => console.log(await m.default.executablePath()))'
        timeout-minutes: 2
      # The 2-core runner is slower than a laptop: the assessment bank tests pass the 5 s default locally but not here.
      # Both shards validate the same pinned main commit and blog commit before publication.
      - run: npm test -- --testTimeout=60000 --shard=${{ matrix.shard }}/2
        timeout-minutes: 35
      - run: npx eslint src
        timeout-minutes: 5
      - run: npm run build
        timeout-minutes: 10

  publish:
    needs: [prepare, validate]
    if: ${{ !endsWith(github.ref_name, '-dryrun') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ github.ref_name }}
      MAIN_SHA: ${{ needs.prepare.outputs.main_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          fetch-depth: 0
      - name: Main is where validate left it
        run: |
          if [ "$(git rev-parse origin/main)" != "$MAIN_SHA" ]; then
            echo "main moved after validation; re-run this workflow" >&2
            exit 1
          fi
      - name: Only blog files changed
        run: |
          git show origin/main:scripts/blog-publish-guard.mjs > "$RUNNER_TEMP/blog-publish-guard.mjs"
          node "$RUNNER_TEMP/blog-publish-guard.mjs" origin/main "$GITHUB_SHA"
      - name: Merge and push main
        run: |
          git config user.name "unica-blog-bot"
          git config user.email "unica-blog-bot@users.noreply.github.com"
          git checkout -B publish origin/main
          git merge --no-ff --no-edit -m "Blog: publish $BRANCH" "$GITHUB_SHA"
          git push origin HEAD:main
      # Vercel promotes a main commit only after its CI `test` check passes. This push used GITHUB_TOKEN, which starts no
      # workflow, so start CI on main here (workflow_dispatch is allowed from GITHUB_TOKEN).
      - name: Run CI on the published commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --ref main
      - name: Delete the published branch if it has not changed
        run: git push --force-with-lease="refs/heads/$BRANCH:$GITHUB_SHA" origin ":refs/heads/$BRANCH"
