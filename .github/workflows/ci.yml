name: CI

# The done gate's test and lint steps on every pull request and every push to main. Vercel lists the `test` job as a
# Deployment Check (Settings → Build and Deployment), so a main commit whose tests fail is built but not promoted to
# production. `next build` (the type check) already runs in Vercel's own build.
# Every main commit needs this check, or its production deploy waits forever. A push made with GITHUB_TOKEN starts no
# workflow, so the blog publish job (blog-publish.yml) starts this one with workflow_dispatch after it pushes main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Each main commit gets its own run: a queued main run must never be dropped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Keep the SQL comparison inside the existing required test job.
    # Supabase uses PostgreSQL 17. This database contains synthetic rows only.
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_PASSWORD: maya-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 2
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: node scripts/generate-family-zones.mjs --check
        timeout-minutes: 1
      - name: Compare family windows and run concurrent quota probes
        run: npm run test:family-zones
        timeout-minutes: 10
        env:
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: maya-ci-only
      # The 2-core runner is slower than a laptop: the assessment bank tests can pass the 5 s default locally but not here.
      - run: npm test -- --testTimeout=60000
        timeout-minutes: 18
      - run: npx eslint src
        timeout-minutes: 5
