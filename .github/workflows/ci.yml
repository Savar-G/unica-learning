name: CI

# Two-tier CI (docs/ci/README.md):
# - On every `push` to `main`, `workflow_dispatch`, or high-blast-radius PR (configs, CI, DB, data, scripts, core shared
#   modules, >40 files), the full suite runs: 8 duration-balanced vitest shards (`unit`) plus `engine` (the workbook v2
#   engine tests and type check), `scan-binding-scale` (3 machines), `maya-behaviour`, `family-zones`, `lint-and-types`, and `voice-worker`.
# - On scoped pull requests, `scope` selects `affected` mode: `engine` runs whenever `src/lib/workbook-v2/**` changes
#   (`unit` does not run), `pr-unit` runs Vitest `--changed` (excluding engine tests) plus dynamically-read consumer tests, `lint-and-types` runs when code changed, and
#   `maya-behaviour` / `family-zones` / `voice-worker` run when their paths change. Docs-only PRs select `skip` mode.
# - The final job, named exactly `test`, aggregates every job and verifies nothing required was skipped or failed.
#   Vercel lists `test` as a Deployment Check (Settings → Build and Deployment), so a main commit whose full suite fails
#   is built but never promoted to production. Branches get no Vercel build (main-only deploys, #774), so `lint-and-types`
#   runs the native app type check (`next typegen && tsgo --noEmit`). A push made with GITHUB_TOKEN starts no workflow, so
#   the blog publish job (blog-publish.yml) starts this one with workflow_dispatch on its merge commit before pushing main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Each main commit gets its own run: a queued main run must never be dropped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      run_pr_unit: ${{ steps.classify.outputs.run_pr_unit }}
      run_changed_unit: ${{ steps.classify.outputs.run_changed_unit }}
      extra_tests: ${{ steps.classify.outputs.extra_tests }}
      run_engine: ${{ steps.classify.outputs.run_engine }}
      run_lint_and_types: ${{ steps.classify.outputs.run_lint_and_types }}
      run_maya_behaviour: ${{ steps.classify.outputs.run_maya_behaviour }}
      run_family_zones: ${{ steps.classify.outputs.run_family_zones }}
      run_voice_worker: ${{ steps.classify.outputs.run_voice_worker }}
      needs_full_history: ${{ steps.classify.outputs.needs_full_history }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
          # Depth 2 fetches the commit and its parents: on pull_request HEAD^1 is the base and HEAD^2 the PR head, on a
          # push HEAD^1 is the commit before.
          fetch-depth: 2
      - id: classify
        run: |
          out=$(node .github/scripts/pr-scope.mjs)
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"
      # This job always runs and has the base, which the engine tests do not. The script needs no package.
      - name: Stored shape fingerprints are unchanged
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: node scripts/shape-fingerprint-base.mjs

  # Full 8-shard unit suite (runs on main pushes, workflow_dispatch, and high-blast-radius PRs).
  # Shard 1 is pinned to hold src/lib/workbook-book1-recovery.test.ts (#472), which loads pinned planners from Git
  # commits, so only shard 1 needs full history (`fetch-depth: 0`); shards 2–8 use a shallow checkout.
  unit:
    name: unit (${{ matrix.shard }}/8)
    needs: [scope]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.shard == 1 && '0' || '1' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      # Unpack @sparticuz/chromium once before parallel workers start so concurrent Chromium test files never race
      # on writing /tmp/chromium (spawn ETXTBSY).
      - name: Unpack Chromium
        run: node -e 'import("@sparticuz/chromium").then(async (m) => console.log(await m.default.executablePath()))'
        timeout-minutes: 2
      # The workbook engine tests, timed Maya files, and the files of the Chromium scale matrix run in dedicated jobs.
      - run: npm test -- --config .github/scripts/vitest-ci.config.mjs --exclude='src/lib/maya-gate/{gate,word-count-grade-1,word-count-grade-4}.test.ts' --exclude='src/lib/scan-binding-scale*-chromium.test.ts' --exclude='src/lib/workbook-v2/**' --testTimeout=60000 --shard=${{ matrix.shard }}/8
        timeout-minutes: 10

  # Fast affected unit tests on scoped pull requests.
  pr-unit:
    name: unit (affected)
    needs: [scope]
    if: needs.scope.outputs.mode == 'affected' && needs.scope.outputs.run_pr_unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.scope.outputs.needs_full_history == 'true' && '0' || '2' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Unpack Chromium
        run: node -e 'import("@sparticuz/chromium").then(async (m) => console.log(await m.default.executablePath()))'
        timeout-minutes: 2
      - name: Run affected unit tests
        if: needs.scope.outputs.run_changed_unit == 'true'
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: npm test -- --config .github/scripts/vitest-ci.config.mjs --changed="$BASE_SHA" --exclude='src/lib/maya-gate/{gate,word-count-grade-1,word-count-grade-4}.test.ts' --exclude='src/lib/workbook-v2/**' --testTimeout=60000 --passWithNoTests
        timeout-minutes: 10
      - name: Run dynamically-referenced consumer tests
        if: needs.scope.outputs.extra_tests != ''
        env:
          EXTRA_TESTS: ${{ needs.scope.outputs.extra_tests }}
        run: |
          read -r -a files <<< "$EXTRA_TESTS"
          npm test -- "${files[@]}" --testTimeout=60000
        timeout-minutes: 8

  # Workbook v2 engine tests and type check on one machine, with no browser, database, or network after install.
  # Runs on every full run and on every PR that changes files under src/lib/workbook-v2/.
  engine:
    name: Workbook engine
    needs: [scope]
    if: needs.scope.outputs.run_engine == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Install the pinned Typst
        run: npm run typst:install
        timeout-minutes: 2
      - name: Architectural guardrails
        run: npm run check:guard
        timeout-minutes: 1
      - name: Engine type check
        run: npm run engine:typecheck
        timeout-minutes: 2
      - name: Engine tests
        id: engine_tests
        run: |
          start_ms=$(node -e 'process.stdout.write(String(Date.now()))')
          set +e
          npm test -- src/lib/workbook-v2/
          status=$?
          set -e
          end_ms=$(node -e 'process.stdout.write(String(Date.now()))')
          echo "duration_ms=$((end_ms - start_ms))" >> "$GITHUB_OUTPUT"
          exit "$status"
        timeout-minutes: 4
      - name: Report engine test time
        if: ${{ always() }}
        env:
          DURATION_MS: ${{ steps.engine_tests.outputs.duration_ms }}
          TEST_OUTCOME: ${{ steps.engine_tests.outcome }}
        run: node .github/scripts/engine-summary.mjs
        timeout-minutes: 1

  maya-behaviour:
    name: Maya behaviour and word limits
    needs: [scope]
    if: needs.scope.outputs.run_maya_behaviour == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      # Public ubuntu-24.04 runners have 4 vCPUs; running all three independent files with --maxWorkers=3 gives each
      # file its own CPU core while retaining every behaviour and all three seeds. Each word-count seed carries its own
      # measured speed budget and a 240 s hang guard (word-count-cases.ts); --testTimeout is for gate.test.ts alone.
      - name: Maya behaviour gate and Grade 1 / Grade 4 word limits
        run: npm test -- src/lib/maya-gate/gate.test.ts src/lib/maya-gate/word-count-grade-1.test.ts src/lib/maya-gate/word-count-grade-4.test.ts --testTimeout=60000 --maxWorkers=3
        timeout-minutes: 6

  # The scan page matrix (src/lib/scan-binding-scale-matrix.ts), one test file a machine. Each file holds a third of the
  # photos. `.github/scripts/engine-ci.test.mjs` checks that this list is every file of the matrix. The job's result is
  # `success` only when all three pass. On a scoped pull request `pr-unit` runs the files that a change touches instead.
  scan-binding-scale:
    name: Chromium scan binding scale (${{ matrix.file }})
    needs: [scope]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        file: [scan-binding-scale-chromium, scan-binding-scale-2-chromium, scan-binding-scale-3-chromium]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm test -- src/lib/${{ matrix.file }}.test.ts --maxWorkers=1
        timeout-minutes: 9

  # SQL comparison of family windows and concurrent quota probes (the only CI job that needs Postgres).
  family-zones:
    name: Family zones SQL
    needs: [scope]
    if: needs.scope.outputs.run_family_zones == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    # Supabase uses PostgreSQL 17. This database contains synthetic rows only.
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_PASSWORD: maya-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: node scripts/generate-family-zones.mjs --check
        timeout-minutes: 1
      - name: Compare family windows and run concurrent quota probes
        run: npm run test:family-zones
        timeout-minutes: 5
        env:
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: maya-ci-only

  # Lint, app type check, retention worker bundle check, and CI script self-tests.
  lint-and-types:
    name: Lint and app types
    needs: [scope]
    if: needs.scope.outputs.run_lint_and_types == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Architectural guardrails
        run: npm run check:guard
        timeout-minutes: 1
      - name: Fast lint (Oxlint)
        run: npx oxlint src worker/maya-voice/src scripts/workbook-worker.ts scripts/retention-worker.ts
        timeout-minutes: 2
      # Full runs (main pushes, workflow_dispatch, high-blast-radius PRs including lint config edits) also run ESLint
      # to enforce the 4 ESLint-only rules not yet implemented in Oxlint (docs/ci/README.md).
      - name: Full lint (ESLint)
        if: needs.scope.outputs.mode == 'full'
        run: npx eslint src scripts/workbook-worker.ts scripts/retention-worker.ts
        timeout-minutes: 4
      - name: App type check
        run: npm run typecheck
        timeout-minutes: 4
      # The daily Family retention workflow runs a bundle that plain Node must load. Build it and load it with --help
      # (no credentials, no database), so an import Node cannot resolve fails here and not at 15:17 UTC (2026-11-06).
      - name: Retention worker loads
        run: node scripts/build-retention-worker.mjs && node --conditions=react-server .retention/worker.mjs --help
        timeout-minutes: 2
      - name: CI tooling self-tests
        run: node --test .github/scripts/blog-publish.test.mjs .github/scripts/unit-shards.test.mjs .github/scripts/pr-scope.test.mjs .github/scripts/engine-ci.test.mjs scripts/ci-audit.test.mjs scripts/pre-push-check.test.mjs scripts/repo-guard.test.mjs scripts/shape-fingerprint-base.test.mjs
        timeout-minutes: 2

  # The root tsconfig.json excludes worker/, so the Maya voice worker's own type check and tests run here.
  voice-worker:
    name: Voice worker
    needs: [scope]
    if: needs.scope.outputs.run_voice_worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Architectural guardrails
        run: npm run check:guard
        timeout-minutes: 1
      - name: Voice worker lint (Oxlint)
        run: npx oxlint worker/maya-voice/src
        timeout-minutes: 2
      - name: Voice worker type check
        run: npm run voice:typecheck
        timeout-minutes: 3
      - name: Voice worker tests
        run: npm run voice:test
        timeout-minutes: 5

  # The required check. Keep this name exactly `test`: Vercel's Deployment Check and branch rules use it.
  test:
    needs: [scope, unit, pr-unit, engine, scan-binding-scale, maya-behaviour, family-zones, lint-and-types, voice-worker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Required CI jobs passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          REASON: ${{ needs.scope.outputs.reason }}
          RUN_PR_UNIT: ${{ needs.scope.outputs.run_pr_unit }}
          RUN_ENGINE: ${{ needs.scope.outputs.run_engine }}
          RUN_LINT: ${{ needs.scope.outputs.run_lint_and_types }}
          RUN_MAYA: ${{ needs.scope.outputs.run_maya_behaviour }}
          RUN_ZONES: ${{ needs.scope.outputs.run_family_zones }}
          RUN_VOICE: ${{ needs.scope.outputs.run_voice_worker }}
          UNIT_RESULT: ${{ needs.unit.result }}
          SCAN_BINDING_RESULT: ${{ needs.scan-binding-scale.result }}
          PR_UNIT_RESULT: ${{ needs.pr-unit.result }}
          ENGINE_RESULT: ${{ needs.engine.result }}
          MAYA_RESULT: ${{ needs.maya-behaviour.result }}
          ZONES_RESULT: ${{ needs.family-zones.result }}
          LINT_RESULT: ${{ needs.lint-and-types.result }}
          VOICE_RESULT: ${{ needs.voice-worker.result }}
        run: |
          echo "scope=$SCOPE_RESULT mode=$MODE ($REASON)"
          echo "unit=$UNIT_RESULT pr-unit=$PR_UNIT_RESULT engine=$ENGINE_RESULT scan-binding=$SCAN_BINDING_RESULT maya=$MAYA_RESULT zones=$ZONES_RESULT lint=$LINT_RESULT voice=$VOICE_RESULT"
          test "$SCOPE_RESULT" = "success"
          case "$MODE" in
            full|affected|skip) ;;
            *)
              echo "FAIL: unexpected mode '$MODE'" >&2
              exit 1
              ;;
          esac
          check_job() {
            local name="$1" required="$2" result="$3"
            case "$required" in
              true)
                if [ "$result" != "success" ]; then
                  echo "FAIL: required job $name ended with $result" >&2
                  exit 1
                fi
                ;;
              false)
                if [ "$result" != "skipped" ]; then
                  echo "FAIL: non-required job $name ended with $result" >&2
                  exit 1
                fi
                ;;
              *)
                echo "FAIL: job $name has invalid required flag '$required'" >&2
                exit 1
                ;;
            esac
          }
          # In full mode every job must succeed and in skip mode none may run, whatever the flags say.
          flag() { case "$MODE" in full) echo true ;; skip) echo false ;; *) echo "$1" ;; esac; }
          check_job "unit" "$([ "$MODE" = "full" ] && echo true || echo false)" "$UNIT_RESULT"
          check_job "scan-binding-scale" "$([ "$MODE" = "full" ] && echo true || echo false)" "$SCAN_BINDING_RESULT"
          check_job "pr-unit" "$([ "$MODE" = "affected" ] && echo "$RUN_PR_UNIT" || echo false)" "$PR_UNIT_RESULT"
          check_job "engine" "$(flag "$RUN_ENGINE")" "$ENGINE_RESULT"
          check_job "maya-behaviour" "$(flag "$RUN_MAYA")" "$MAYA_RESULT"
          check_job "family-zones" "$(flag "$RUN_ZONES")" "$ZONES_RESULT"
          check_job "lint-and-types" "$(flag "$RUN_LINT")" "$LINT_RESULT"
          check_job "voice-worker" "$(flag "$RUN_VOICE")" "$VOICE_RESULT"
