name: CI

# Two-tier CI (docs/ci/README.md):
# - On every `push` to `main`, `workflow_dispatch`, or high-blast-radius PR (configs, CI, DB, data, scripts, core shared
#   modules, >40 files), the full suite runs: 5 duration-balanced vitest shards (`unit`) plus `maya-behaviour`,
#   `family-zones`, `lint-and-types`, and `voice-worker`.
# - On scoped pull requests, `scope` selects `affected` mode (Vitest `--changed` + any dynamically-read consumer tests,
#   full `lint-and-types` when code changed, and path-scoped `maya-behaviour` / `family-zones` / `voice-worker`), or
#   `skip` mode when only unreferenced docs/design files changed.
# - The final job, named exactly `test`, aggregates every job and verifies nothing required was skipped or failed.
#   Vercel lists `test` as a Deployment Check (Settings → Build and Deployment), so a main commit whose full suite fails
#   is built but never promoted to production. Branches get no Vercel build (main-only deploys, #774), so `lint-and-types`
#   runs the native app type check (`next typegen && tsgo --noEmit`). A push made with GITHUB_TOKEN starts no workflow, so
#   the blog publish job (blog-publish.yml) starts this one with workflow_dispatch after it pushes main.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request keeps only its newest run. Each main commit gets its own run: a queued main run must never be dropped.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.classify.outputs.mode }}
      reason: ${{ steps.classify.outputs.reason }}
      base_sha: ${{ steps.classify.outputs.base_sha }}
      run_pr_unit: ${{ steps.classify.outputs.run_pr_unit }}
      run_changed_unit: ${{ steps.classify.outputs.run_changed_unit }}
      extra_tests: ${{ steps.classify.outputs.extra_tests }}
      run_lint_and_types: ${{ steps.classify.outputs.run_lint_and_types }}
      run_maya_behaviour: ${{ steps.classify.outputs.run_maya_behaviour }}
      run_family_zones: ${{ steps.classify.outputs.run_family_zones }}
      run_voice_worker: ${{ steps.classify.outputs.run_voice_worker }}
      needs_full_history: ${{ steps.classify.outputs.needs_full_history }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
          # Depth 2 on pull_request fetches the merge commit plus both parents (HEAD^1 = base, HEAD^2 = PR head).
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}
      - id: classify
        run: |
          out=$(node .github/scripts/pr-scope.mjs)
          echo "$out"
          echo "$out" >> "$GITHUB_OUTPUT"

  # Full 5-shard unit suite (runs on main pushes, workflow_dispatch, and high-blast-radius PRs).
  # Shard 1 is pinned to hold src/lib/workbook-book1-recovery.test.ts (#472), which loads pinned planners from Git
  # commits, so only shard 1 needs full history (`fetch-depth: 0`); shards 2–5 use a shallow checkout.
  unit:
    name: unit (${{ matrix.shard }}/5)
    needs: [scope]
    if: needs.scope.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: ${{ matrix.shard == 1 && '0' || '1' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      # Unpack @sparticuz/chromium once before parallel workers start so concurrent Chromium test files never race
      # on writing /tmp/chromium (spawn ETXTBSY).
      - name: Unpack Chromium
        run: node -e 'import("@sparticuz/chromium").then(async (m) => console.log(await m.default.executablePath()))'
        timeout-minutes: 2
      # The timed Maya files run below on their own runner without other unit files competing for CPU.
      - run: npm test -- --config .github/scripts/vitest-ci.config.mjs --exclude='src/lib/maya-gate/{gate,word-count-grade-1,word-count-grade-4}.test.ts' --testTimeout=60000 --shard=${{ matrix.shard }}/5
        timeout-minutes: 20

  # Fast affected unit tests on scoped pull requests.
  pr-unit:
    name: unit (affected)
    needs: [scope]
    if: needs.scope.outputs.mode == 'affected' && needs.scope.outputs.run_pr_unit == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: ${{ needs.scope.outputs.needs_full_history == 'true' && '0' || '2' }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Unpack Chromium
        run: node -e 'import("@sparticuz/chromium").then(async (m) => console.log(await m.default.executablePath()))'
        timeout-minutes: 2
      - name: Run affected unit tests
        if: needs.scope.outputs.run_changed_unit == 'true'
        env:
          BASE_SHA: ${{ needs.scope.outputs.base_sha }}
        run: npm test -- --config .github/scripts/vitest-ci.config.mjs --changed="$BASE_SHA" --exclude='src/lib/maya-gate/{gate,word-count-grade-1,word-count-grade-4}.test.ts' --testTimeout=60000 --passWithNoTests
        timeout-minutes: 15
      - name: Run dynamically-referenced consumer tests
        if: needs.scope.outputs.extra_tests != ''
        env:
          EXTRA_TESTS: ${{ needs.scope.outputs.extra_tests }}
        run: |
          read -r -a files <<< "$EXTRA_TESTS"
          npm test -- "${files[@]}" --testTimeout=60000
        timeout-minutes: 10

  maya-behaviour:
    name: Maya behaviour and word limits
    needs: [scope]
    if: needs.scope.outputs.run_maya_behaviour == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      # Public ubuntu-24.04 runners have 4 vCPUs; running all three independent files with --maxWorkers=3 gives each
      # file its own CPU core while retaining every behaviour, all three seeds and the same 60 s test timeout.
      - name: Maya behaviour gate and Grade 1 / Grade 4 word limits
        run: npm test -- src/lib/maya-gate/gate.test.ts src/lib/maya-gate/word-count-grade-1.test.ts src/lib/maya-gate/word-count-grade-4.test.ts --testTimeout=60000 --maxWorkers=3
        timeout-minutes: 15

  # SQL comparison of family windows and concurrent quota probes (the only CI job that needs Postgres).
  family-zones:
    name: Family zones SQL
    needs: [scope]
    if: needs.scope.outputs.run_family_zones == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Supabase uses PostgreSQL 17. This database contains synthetic rows only.
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:839fbb5a4942a7758dd93e18b42ea5649807491a0545b5eeeb8f0b8bb11857a5
        env:
          POSTGRES_PASSWORD: maya-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: node scripts/generate-family-zones.mjs --check
        timeout-minutes: 1
      - name: Compare family windows and run concurrent quota probes
        run: npm run test:family-zones
        timeout-minutes: 10
        env:
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: maya-ci-only

  # Lint, app type check, retention worker bundle check, and CI script self-tests.
  lint-and-types:
    name: Lint and app types
    needs: [scope]
    if: needs.scope.outputs.run_lint_and_types == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Fast lint (Oxlint)
        run: npx oxlint src
        timeout-minutes: 2
      # Full runs (main pushes, workflow_dispatch, high-blast-radius PRs including lint config edits) also run ESLint
      # to enforce the 4 ESLint-only rules not yet implemented in Oxlint (docs/ci/README.md).
      - name: Full lint (ESLint)
        if: needs.scope.outputs.mode == 'full'
        run: npx eslint src
        timeout-minutes: 5
      - name: App type check
        run: npm run typecheck
        timeout-minutes: 8
      # The daily Family retention workflow runs a bundle that plain Node must load. Build it and load it with --help
      # (no credentials, no database), so an import Node cannot resolve fails here and not at 15:17 UTC (2026-11-06).
      - name: Retention worker loads
        run: node scripts/build-retention-worker.mjs && node --conditions=react-server .retention/worker.mjs --help
        timeout-minutes: 2
      - name: CI tooling self-tests
        run: node --test .github/scripts/unit-shards.test.mjs .github/scripts/pr-scope.test.mjs scripts/ci-audit.test.mjs
        timeout-minutes: 2

  # The root tsconfig.json excludes worker/, so the Maya voice worker's own type check and tests run here.
  voice-worker:
    name: Voice worker
    needs: [scope]
    if: needs.scope.outputs.run_voice_worker == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 4
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - name: Voice worker type check
        run: npm run voice:typecheck
        timeout-minutes: 5
      - name: Voice worker tests
        run: npm run voice:test
        timeout-minutes: 8

  # The required check. Keep this name exactly `test`: Vercel's Deployment Check and branch rules use it.
  test:
    needs: [scope, unit, pr-unit, maya-behaviour, family-zones, lint-and-types, voice-worker]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Required CI jobs passed
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          MODE: ${{ needs.scope.outputs.mode }}
          REASON: ${{ needs.scope.outputs.reason }}
          RUN_PR_UNIT: ${{ needs.scope.outputs.run_pr_unit }}
          RUN_LINT: ${{ needs.scope.outputs.run_lint_and_types }}
          RUN_MAYA: ${{ needs.scope.outputs.run_maya_behaviour }}
          RUN_ZONES: ${{ needs.scope.outputs.run_family_zones }}
          RUN_VOICE: ${{ needs.scope.outputs.run_voice_worker }}
          UNIT_RESULT: ${{ needs.unit.result }}
          PR_UNIT_RESULT: ${{ needs.pr-unit.result }}
          MAYA_RESULT: ${{ needs.maya-behaviour.result }}
          ZONES_RESULT: ${{ needs.family-zones.result }}
          LINT_RESULT: ${{ needs.lint-and-types.result }}
          VOICE_RESULT: ${{ needs.voice-worker.result }}
        run: |
          echo "scope=$SCOPE_RESULT mode=$MODE ($REASON)"
          echo "unit=$UNIT_RESULT pr-unit=$PR_UNIT_RESULT maya=$MAYA_RESULT zones=$ZONES_RESULT lint=$LINT_RESULT voice=$VOICE_RESULT"
          test "$SCOPE_RESULT" = "success"
          check_job() {
            local name="$1" required="$2" result="$3"
            if [ "$required" = "true" ]; then
              if [ "$result" != "success" ]; then
                echo "FAIL: required job $name ended with $result" >&2
                exit 1
              fi
            else
              if [ "$result" != "skipped" ]; then
                echo "FAIL: non-required job $name ended with $result" >&2
                exit 1
              fi
            fi
          }
          check_job "unit" "$([ "$MODE" = "full" ] && echo true || echo false)" "$UNIT_RESULT"
          check_job "pr-unit" "$([ "$MODE" = "affected" ] && [ "$RUN_PR_UNIT" = "true" ] && echo true || echo false)" "$PR_UNIT_RESULT"
          check_job "maya-behaviour" "$RUN_MAYA" "$MAYA_RESULT"
          check_job "family-zones" "$RUN_ZONES" "$ZONES_RESULT"
          check_job "lint-and-types" "$RUN_LINT" "$LINT_RESULT"
          check_job "voice-worker" "$RUN_VOICE" "$VOICE_RESULT"
