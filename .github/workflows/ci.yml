name: CI

# The done gate's test and lint steps on every pull request and every push to main. Vercel lists the `test` job as a
# Deployment Check (Settings → Build and Deployment), so a main commit whose tests fail is built but not promoted to
# production. `next build` (the type check) already runs in Vercel's own build.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        timeout-minutes: 2
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        timeout-minutes: 2
        with:
          node-version: '22.23.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
        timeout-minutes: 5
      - run: npm test
        timeout-minutes: 10
      - run: npx eslint src
        timeout-minutes: 5
